<style>
/* "Clean plate": phone-first single column, soft white cards on a light steel background (navy/slate in dark), plate-blue accent, bottom tab bar */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#eef2f8; --line:#e3e8ef;
  --fg:#141a23; --muted:#5b6676; --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#dbe6fb;
  --good:#1d8a52; --danger:#c43a2f;
  --shadow:0 1px 3px rgb(20 30 50 / .08); --card-border:transparent;
  --r-card:20px; --r-btn:14px; --tabbar:84px;
  --bg-grad:linear-gradient(165deg,color-mix(in srgb,var(--accent) 12%,#fff) 0%,color-mix(in srgb,var(--accent) 5%,#f4f5f8) 55%,color-mix(in srgb,var(--accent) 8%,#fff) 100%);
  --hero:#0f1115; --hero-ink:#ffffff; --ring:color-mix(in srgb,var(--accent) 55%,#fff);
  --bar:#0f1115; --bar-ink:#8a90a0; --bar-on:#ffffff; --pop:0 10px 28px rgb(15 17 21 / .28);
  --gold:linear-gradient(150deg,#ffe58a,#ffb020); --silver:linear-gradient(150deg,#f4f6fb,#aab2c5); --bronze:linear-gradient(150deg,#ffc29a,#d9783c); --star:#e0a800;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171d26; --sunk:#0b0f14; --line:#283140;
  --fg:#e6ebf2; --muted:#8c97a8; --accent:#6c9cff; --accent-ink:#0b1220; --accent-soft:#1b2a47;
  --good:#4cc78a; --danger:#ff7a6e; --shadow:none; --card-border:var(--line); color-scheme:dark;
  --bg-grad:linear-gradient(165deg,color-mix(in srgb,var(--accent) 14%,#0c0d10) 0%,color-mix(in srgb,var(--accent) 5%,#0c0d10) 55%,color-mix(in srgb,var(--accent) 10%,#0c0d10) 100%);
  --hero:#262a35; --bar:#232731; --bar-ink:#8f95a3; --pop:0 10px 28px rgb(0 0 0 / .5)}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171d26; --sunk:#0b0f14; --line:#283140;
  --fg:#e6ebf2; --muted:#8c97a8; --accent:#6c9cff; --accent-ink:#0b1220; --accent-soft:#1b2a47;
  --good:#4cc78a; --danger:#ff7a6e; --shadow:none; --card-border:var(--line); color-scheme:dark;
  --bg-grad:linear-gradient(165deg,color-mix(in srgb,var(--accent) 14%,#0c0d10) 0%,color-mix(in srgb,var(--accent) 5%,#0c0d10) 55%,color-mix(in srgb,var(--accent) 10%,#0c0d10) 100%);
  --hero:#262a35; --bar:#232731; --bar-ink:#8f95a3; --pop:0 10px 28px rgb(0 0 0 / .5)}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{touch-action:pan-x pan-y;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,[data-act],.pill,.chip,.tile,.exchip,.tabbar,.hero,select,summary,label.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.pill,.chip,.tile,.exchip,.tabbar,.hero,.week,.seg,.pills,.bigstep,.stepper,.swatch,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
img{max-width:100%}
*{box-sizing:border-box}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--fg);font:15px/1.5 var(--f-body);margin:0;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.plate{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 6px var(--accent),inset 0 0 0 8px var(--surface)}
.sync{font-size:12px;color:var(--muted);text-align:end}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;min-width:0}
.fields input{font-family:var(--f-num)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font:700 15px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);list-style-position:outside}
details[open] summary{margin-bottom:10px}
.insight{border-inline-start:3px solid var(--line);padding:2px 0;padding-inline-start:12px;display:flex;flex-direction:column;gap:6px}
.insight.good{border-inline-start-color:var(--good)} .insight.warn{border-inline-start-color:var(--danger)} .insight.info{border-inline-start-color:var(--muted)}
.insight b{font-weight:600}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.bars .track{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.bars .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:var(--muted)}
.bars .fill.low{background:var(--danger)} .bars .fill.ok{background:var(--good)}
.bars .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.ai{white-space:pre-wrap;font-size:14px;line-height:1.6}
main{padding-block:18px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;inset-inline:max(12px,env(safe-area-inset-left,0px));margin-inline:auto;max-width:616px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:14;display:flex;justify-content:space-around;align-items:stretch;background:var(--bar);border-radius:26px;box-shadow:var(--pop);height:64px;padding:0 6px}
.tabbar button{appearance:none;border:0;background:none;color:var(--bar-ink);flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px/1 var(--f-body);cursor:pointer}
.tabbar svg{width:24px;height:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
/* Workout focus mode */
.exchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.exchips::-webkit-scrollbar{display:none}
.exchip{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px 4px 6px;border-radius:999px;border:1px solid var(--card-border);background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font:600 13px/1 var(--f-body);cursor:pointer}
.exchip .t{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exchip .n{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.exchip.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.exchip.started .n{border-color:var(--accent);color:var(--accent)}
.exchip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exchip[aria-current="true"] .n{border-color:var(--accent-ink);color:var(--accent-ink);background:transparent}
.card.focus .ex-name{font-size:26px}
.bignum{font:600 34px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.bignum small{font-size:14px;color:var(--muted);font-weight:500}
.nextbtn{overflow:hidden;text-overflow:ellipsis}
.complete-card .tick{width:34px;height:34px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;font-weight:700}
.sheet .card{box-shadow:none;border:0;padding:0;background:none}
.tabbar button[aria-current="page"]{color:var(--bar-on)}
.tabbar button[aria-current="page"] svg{color:var(--ring)}
.tabbar button.has-dot{position:relative}
.tabbar button.has-dot::after{content:"";position:absolute;top:8px;inset-inline-start:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--bar)}
/* section switcher (pills) */
#pills{margin-bottom:16px}
.card:empty{display:none}
button.wd{appearance:none;font:inherit;color:inherit;cursor:pointer}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slide-r{animation:slideR .22s ease-out}
.slide-l{animation:slideL .22s ease-out}
@keyframes slideR{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.brow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .mk{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;color:#14161c}
.brow .mk svg{width:20px;height:20px}
.brow .mk.bronze{background:var(--bronze)} .brow .mk.silver{background:var(--silver)} .brow .mk.gold{background:var(--gold)}
.brow .mk.locked{background:var(--sunk);color:var(--muted);border:1.5px dashed var(--line)}
.brow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.brow.off .t b{color:var(--muted)}
.row>h2.grow{flex:1 1 150px}
.dyn{display:contents}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;appearance:none;border:1px solid var(--card-border);border-radius:999px;padding:0 15px;min-height:44px;background:var(--surface);color:var(--muted);font:600 13px/1 var(--f-body);box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill .count{min-width:18px;padding:2px 5px;border-radius:9px;background:var(--danger);color:#fff;font:700 12px/16px var(--f-body);text-align:center}
/* hero block: level ring */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--pop)}
button.hero{appearance:none;border:0;width:100%;text-align:start;font:inherit;cursor:pointer}
.hero h3{color:inherit;opacity:.7}
.hero .prev{color:inherit;opacity:.7}
.hero .ebar{background:rgb(255 255 255 / .16)}
.hero .ebar>i{background:var(--ring)}
.ring{position:relative;width:66px;height:66px;flex:none;direction:ltr}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgb(255 255 255 / .18)}
.ring .pr{stroke:var(--ring);transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 24px/1 var(--f-num)}
.streakflag{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.streakflag svg{width:16px;height:16px;color:#ff7a45}
/* badge wall: tiles with tier colour and stars */
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.tile{appearance:none;border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;padding:0}
.tile .face{width:100%;max-width:92px;aspect-ratio:1;border-radius:24px;display:grid;place-items:center;color:#14161c;box-shadow:0 6px 14px rgb(15 17 21 / .14)}
.tile .face svg{width:44%;height:44%}
.tile.bronze .face{background:var(--bronze)} .tile.silver .face{background:var(--silver)} .tile.gold .face{background:var(--gold)}
.tile.locked .face{background:var(--sunk);color:var(--muted);box-shadow:none;border:1.5px dashed var(--line)}
.stars{display:inline-flex;gap:2px;color:var(--star)}
.stars svg{width:11px;height:11px}
.stars svg.off{opacity:.28}
.tile .nm{font-weight:600;font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.tile .lv{font-size:12px;color:var(--muted)}
.tile .ebar{width:100%;max-width:92px;height:5px}
.tile .bsub{font-size:12px;line-height:1.25;color:var(--muted)}
/* challenge podium (a chart: stays left-to-right) */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;direction:ltr;padding-top:6px}
.podium .step{flex:1 1 0;max-width:112px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:600}
.podium .step .who{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:2px solid var(--line);font:700 15px/1 var(--f-body)}
.podium .r1 .av{width:48px;height:48px;border-color:#ffc83d;box-shadow:0 0 0 3px rgb(255 200 61 / .35)}
.podium .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:start center;padding-top:6px;font:700 22px/1 var(--f-num);color:#14161c}
.podium .r1 .blk{height:88px;background:var(--gold)} .podium .r2 .blk{height:60px;background:var(--silver)} .podium .r3 .blk{height:44px;background:var(--bronze)}
.podium .crown{color:var(--star)} .podium .crown svg{width:20px;height:20px}
.winner{display:flex;align-items:center;gap:10px;background:var(--gold);color:#14161c;border-radius:18px;padding:12px 14px;font-weight:700}
.winner svg{width:26px;height:26px;flex:none}
/* celebration card */
dialog.celebrate{border:0;border-radius:28px;width:min(92vw,360px);padding:30px 22px 22px;text-align:center;background:var(--surface);color:var(--fg);box-shadow:0 24px 64px rgb(0 0 0 / .4);overflow:visible}
dialog.celebrate::backdrop{background:rgb(8 10 16 / .72)}
dialog.celebrate .face{width:112px;height:112px;margin:0 auto 14px;border-radius:32px;display:grid;place-items:center;color:#14161c;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
dialog.celebrate .face svg{width:48%;height:48%}
dialog.celebrate .face.bronze{background:var(--bronze)} dialog.celebrate .face.silver{background:var(--silver)} dialog.celebrate .face.gold{background:var(--gold)}
dialog.celebrate .face.lvl{background:var(--hero);color:var(--hero-ink);font:700 44px/1 var(--f-num)}
dialog.celebrate h2{margin-bottom:6px}
dialog.celebrate .stars{display:flex;justify-content:center;margin-bottom:8px}
dialog.celebrate .label{display:block;margin-bottom:4px}
dialog.celebrate .stars svg{width:20px;height:20px}
dialog.celebrate canvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.more-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:600 16px/1 var(--f-body);cursor:pointer;text-align:left}
.more-row svg{width:20px;height:20px;color:var(--muted)}
a.more-row{text-decoration:none}
.chrow{display:grid;grid-template-columns:32px 32px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.chrow .rank{font-weight:700;color:var(--muted);text-align:center}
.chrow .nm{overflow-wrap:anywhere}
.chbar{grid-column:3 / 5;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.chbar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.jr-dots{display:flex;gap:6px;align-items:center}
.jr-dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.jr-dot.on{background:var(--accent)}
.jr-opt{display:block;width:100%;text-align:start;padding:14px 16px;border:2px solid var(--line);border-radius:var(--r-card);background:var(--surface);color:var(--fg);font:600 16px/1.3 var(--f-body);cursor:pointer}
.jr-opt small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.jr-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fcard{display:flex;align-items:center;gap:8px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;text-align:start;cursor:pointer}
.fcard svg{width:20px;height:20px;color:var(--muted);flex:none}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:hsl(var(--h) 55% 38%);color:#fff;font:700 15px/1 var(--f-num)}
.lvchip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.card>.seg{margin-bottom:12px}
.boardrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.boardrow .rank{width:24px;text-align:center;font-weight:700;color:var(--muted);flex:none}
.boardrow .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-weight:600}
.boardrow.me .avatar{box-shadow:0 0 0 3px var(--accent)}
.daysum{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;min-height:44px;text-align:start;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.card.banner{border:1.5px solid var(--accent);background:var(--accent-soft)}
[dir="rtl"] .fcard svg{transform:scaleX(-1)}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:9px 4px;text-align:center;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:start}
.cmp th{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cmp .lead{font-weight:700;color:var(--accent)}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 14px/1 var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
/* big stepper: − value + with 48px round buttons (Workout focus mode) */
.bigstep{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:16px;padding:6px}
.bigstep button{appearance:none;flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);font:700 22px/1 var(--f-body);box-shadow:var(--shadow);cursor:pointer}
.bigstep input{flex:1;border:0;background:none;text-align:center;font:600 28px/1 var(--f-num);padding:6px 0}

.view{display:flex;flex-direction:column;gap:16px}

  fUnsub:[],

      }

      await delAll((await T(getDocs(query(collection(fs,"friendships"),where("users","array-contains",uid))))).docs.map(d=>d.ref));
      step="challenges"; onStep(step);
      for(const cd of (await T(getDocs(query(collection(fs,"challenges"),where("members","array-contains",uid))))).docs){
        const ch=cd.data();
        if(ch.owner===uid){   // my challenge: every score goes first, then the challenge itself
          await delAll((await T(getDocs(collection(fs,"challenges",cd.id,"progress")))).docs.map(d=>d.ref));
          await delAll([cd.ref]);
        }else{                // someone else's: my score, then I come off both lists
          const b=writeBatch(fs);
          b.delete(doc(fs,"challenges",cd.id,"progress",uid));
          b.update(cd.ref,{members:ch.members.filter(m=>m!==uid),joined:ch.joined.filter(m=>m!==uid),names:Object.fromEntries(Object.entries(ch.names||{}).filter(([m])=>m!==uid)),updated:Date.now()});
          await T(b.commit());
        }
      }
      step="blocks"; onStep(step);
      await delAll((await T(getDocs(query(collection(fs,"blocks"),where("blocker","==",uid))))).docs.map(d=>d.ref));
      step="items"; onStep(step);
      for(let pass=0;pass<3;pass++){   // list again after deleting, in case something was written meanwhile
        const docs=(await T(getDocs(collection(fs,"users",uid,"items")))).docs;
        if(!docs.length) break;
        await delAll(docs.map(d=>d.ref));
      }
      step="device"; onStep(step);
      try{ Object.keys(localStorage).filter(k=>k.startsWith("ironlog.")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
      try{ await terminate(fs); await clearIndexedDbPersistence(fs); }catch(e){}
      step="account"; onStep(step);
      await T(deleteUser(auth.currentUser));
      return {ok:true};
    }catch(e){ console.error(e); return {ok:false,step,reason:"error"}; }
  },
  // One fetch per person at a time; an answer that arrives after sign-out or an account switch is thrown away.
  friendProfile(uid){
    const fr=state.friends; fr.inflight=fr.inflight||{};
    if(fr.inflight[uid]) return fr.inflight[uid];
    return fr.inflight[uid]=(async()=>{
      let p=null;
      try{ const s=await withTimeout(getDoc(doc(fs,"profiles",uid)),20000); p=s.exists()?s.data():null; }catch(e){}
      delete fr.inflight[uid];
      if(state.friends===fr) fr.data[uid]={profile:p,at:Date.now()};
      return p;
    })();
  },
  async loadShare(){
    const sh=state.share; sh.loaded=false; sh.failed=false;
    try{ const snap=await withTimeout(getDoc(doc(fs,"profiles",this.user.uid)),20000); sh.profile=snap.exists()?snap.data():null; sh.last=(sh.profile&&sh.profile.summary)||null; sh.lastAt=0; }
    catch(e){ console.error(e); sh.profile=null; sh.failed=true; }
    sh.loaded=true;
  },
  // next = {username, displayName, visibility, findByEmail}. Returns {ok:true} or {ok:false, reason}.
  async saveShare(next){
    if(navigator.onLine===false) return {ok:false,reason:"offline"};
    const u=this.user, sh=state.share, email=u.emailVerified?normalizeEmail(u.email):null;
    if(sh.failed){ await this.loadShare(); if(sh.failed) return {ok:false,reason:"error"}; }  // the sign-in load failed: never save over a profile we could not read
    const summary=(next.visibility==="friends"||next.visibility==="public")?currentSummary():null;
    const plan=planShare({uid:u.uid,current:sh.profile,next,email,summary,now:Date.now()});
    if(plan.error) return {ok:false,reason:plan.error};
    sh.busy=true;
    try{
      const b=writeBatch(fs);
      for(const o of plan.ops){ const ref=doc(fs,...o.path); if(o.op==="set") b.set(ref,o.data); else if(o.op==="update") b.update(ref,o.data); else b.delete(ref); }
      await withTimeout(b.commit(),20000);
      sh.profile=plan.ops.find(o=>o.path[0]==="profiles").data; sh.last=summary; sh.lastAt=Date.now();
      return {ok:true};
    }catch(e){ console.error(e); return {ok:false,reason:e&&e.code==="permission-denied"?"taken":"error"}; }
    finally{ sh.busy=false; }
  },
  async deleteShare(){
    const sh=state.share, p=sh.profile; if(!p) return true;
    if(navigator.onLine===false) return false;
    try{
      const b=writeBatch(fs), email=this.user.emailVerified?normalizeEmail(this.user.email):null;
      b.delete(doc(fs,"profiles",this.user.uid)); b.delete(doc(fs,"usernames",p.username));
      if(p.findByEmail&&email) b.delete(doc(fs,"emails",email));
      await withTimeout(b.commit(),20000); sh.profile=null; sh.last=null; return true;
    }catch(e){ console.error(e); return false; }
  },
  // Exact username or e-mail -> {status:"found", uid, profile} or {status:"none"}. Every failure (missing,
  // not findable, profile not readable) is the same "none", so a search can't tell hidden from absent.
  async lookup(q){
    try{
      const raw=String(q||"").trim(), email=normalizeEmail(raw);
      let uid=null, byName=null;
      if(email){ const s=await withTimeout(getDoc(doc(fs,"emails",email)),20000); if(s.exists()) uid=s.data().uid; }
      else{ const name=normalizeUsername(raw); if(!validUsername(name).ok) return {status:"none"}; const s=await withTimeout(getDoc(doc(fs,"usernames",name)),20000); if(s.exists()){ uid=s.data().uid; byName=name; } }
      if(!uid) return {status:"none"};
      try{
        const p=await withTimeout(getDoc(doc(fs,"profiles",uid)),20000);
        if(p.exists()) return {status:"found",uid,profile:p.data()};
      }catch(e){}
      return byName?{status:"hidden",uid,username:byName}:{status:"none"};
    }catch(e){ return {status:"none"}; }
  },
  write(id, body){
    if (!this.col || this.wiping) return;

      console.error(e);
      toast(e && e.code==="permission-denied" ? t("Not allowed to save. Sign out and back in.") : e && e.code==="resource-exhausted" ? t("Daily free limit reached. Changes will save tomorrow.") : t("Couldn't save. Check your connection."));
    });
  },
  save(w){
    w.updated=Date.now();
    const i=state.workouts.findIndex(x=>x.id===w.id); if(i<0) state.workouts.push(w); else state.workouts[i]=w;
    const body={date:w.date,dayId:w.dayId||null,dayName:w.dayName||null,entries:w.entries,updated:w.updated};
    if(w.cardio) body.cardio=w.cardio;  // only when present: Firestore rejects undefined

  },
  remove(id){ state.workouts=state.workouts.filter(w=>w.id!==id); this.write(id,null); },
  saveDays(days){ state.days=days; this.write("program",{days,v:PROGRAM_VERSION,updated:Date.now()}); },
  saveBody(entry){
    const i=state.body.findIndex(x=>x.date===entry.date); if(i<0) state.body.push(entry); else state.body[i]=entry;
    this.write("b-"+entry.date, entry);
  },
  removeBody(date){ state.body=state.body.filter(x=>x.date!==date); this.write("b-"+date,null); },
  saveProfile(p){ state.profile=p; this.write("profile",p); },
  // Whole-doc setDoc, so exercise names containing dots are safe as map keys.
  // One doc per day of meals; the last meal removed deletes the doc.
  saveFood(doc){ const meals=doc.meals||[];
    if(meals.length){ state.food[doc.date]={date:doc.date,meals}; this.write("f-"+doc.date,{date:doc.date,meals,updated:Date.now()}); }
    else { delete state.food[doc.date]; this.write("f-"+doc.date,null); } },
  // My own foods (the `foods` document, at most 200). An empty list deletes the document.
  saveFoods(list){ const l=list.slice(0,200); state.myFoods=l; this.write("foods",l.length?{list:l,updated:Date.now()}:null); },
  // Merges a partial change (rest times or seen badges) so neither field drops the other.
  saveSettings(patch){ const s={...state.settings,...patch}; state.settings=s;
    this.write("settings",settingsDoc(s,Date.now())); },
  async restore(items){
    // items: [{id, data}] ; Firestore batches hold up to 500 writes
    for (let i=0;i<items.length;i+=450){
      const batch=writeBatch(fs);
      items.slice(i,i+450).forEach(it=>batch.set(doc(this.col,it.id), it.data));
      await batch.commit();
    }
  }
};
function signInError(e){
  const c=e&&e.code||"";

const toastPopover=!!HTMLElement.prototype.showPopover;
if(!toastPopover){ const el=$("#toast"); el.removeAttribute("popover"); el.hidden=true; }

  const el=$("#toast"); el.textContent=t; clearTimeout(tt);

}

// My training-day count for every challenge I joined, written to my own progress document (a number, nothing else).
// Same pattern as the profile summary: only after a server snapshot, only when the number changed, at most every 20 s per challenge.
let progressTimer=null;
function publishProgress(force){
  const c=state.challenges, me=store.user&&store.user.uid;
  if(!me||!state.authed||!state.serverSynced||store.wiping||!c.loaded) return;
  const t=today(), now=Date.now(); let retry=0;
  for(const ch of c.docs){
    if(!ch.joined.includes(me)) continue;
    const st=statusOf(ch,t); if(st==="upcoming") continue;
    if(addDaysISO(ch.start,ch.weeks*7-1)!==ch.end) continue;   // dates that do not match the length: never write
    if(st==="finished"&&t>addDaysISO(ch.end,7)) continue;   // a week of grace after the end for late or offline scores
    const days=Math.min(countDays(state.workouts,ch.start,ch.end,t,trainedOn),ch.weeks*7);
    if(c.last[ch.id]===days) continue;
    const wait=20000-(now-(c.lastAt[ch.id]||0));
    if(!force&&wait>0){ retry=Math.max(retry,wait); continue; }
    c.last[ch.id]=days; c.lastAt[ch.id]=now;
    store.challengeAction(planProgress({cid:ch.id,me,days,now})).then(r=>{ if(!r.ok) delete c.last[ch.id]; });
  }
  clearTimeout(progressTimer); if(retry) progressTimer=setTimeout(()=>publishProgress(false),retry+50);
}

  // keep the open exercise's chip in view without scrolling the page

function chipInfo(chip,name){ const i=infoBtn(name); return i ? `<span class="chipgrp">${chip}${i}</span>` : chip; }
// Reads the weight/reps inputs of exercise ei; shows a toast and returns null if invalid.
function readSet(ei){
  const w=parseFloat(String(document.getElementById("w-"+ei).value).replace(",",".")), r=parseInt(document.getElementById("r-"+ei).value,10);
  if(!(w>=0)||!(r>0)){ toast(t("Enter a weight (0 for bodyweight) and at least 1 rep")); return null; }
  return {w,r};
}
function stopEditing(){ state.setKind="normal"; if(state.editSet){ delete ui[state.editSet.ex]; state.editSet=null; } }
function ensureWorkout(){ const w=workoutFor(state.date); return w?clone(w):{id:"w-"+state.date,date:state.date,dayId:null,dayName:null,entries:[]}; }
function canonical(name){ name=resolveAlias(reverseName("ex",name)); return [...exerciseNames(),...ALL_EX].find(n=>same(n,name)) || name; }
function startDay(day){
  const w = ensureWorkout();
  const kept = w.entries.filter(e=>e.sets.length);
  w.dayId = day?day.id:null; w.dayName = day?day.name:"Free workout";
  w.entries = kept.concat((day?day.exercises:[]).filter(n=>!kept.some(e=>same(e.ex,n))).map(n=>({ex:n,sets:[]})));
  state.pickDay=false; state.openEx=undefined; store.save(w); renderLog();
}
function scrollToOpen(){ setTimeout(()=>{ const el=document.getElementById("open-card"); if(el) el.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); },0); }
function addExerciseToWorkout(name){
  closeSheet("#exsheet");
  name=canonical(name.trim()); if(!name) return;
  const w=ensureWorkout();
  if(w.entries.some(x=>same(x.ex,name))){ toast(t("{name} is already in this workout",{name:nameOf("ex",name)})); return; }
  w.entries.push({ex:name,sets:[]}); delete ui[name]; state.openEx=name; store.save(w); renderLog(); scrollToOpen();
}

/* ---------- DAYS ---------- */
function tplGrid(confirmable){
  return `<div class="tpl">${TEMPLATES.map((tp,i)=>`<button class="daypick" data-act="use-tpl" data-i="${i}"><span class="dayname" style="font-size:20px">${esc(nameOf("template",tp.name))}</span><small>${esc(nameOf("tplnote",tp.note))}</small><span class="chips">${tp.days.map(d=>`<span class="chip">${esc(nameOf("day",d.name))}</span>`).join("")}</span></button>`).join("")}
    ${confirmable?"":`<button class="daypick" data-act="add-day"><span class="dayname" style="font-size:20px">Blank</span><small>Name your own days</small></button>`}</div>`;
}
function weekStrip(){
  const tip=state.days.some(d=>(d.weekdays||[]).length)?"":`<p class="prev" style="margin:0">Tip: tap a weekday to choose which day you train on it. The Today tab will then pick today's day for you.</p>`;
  const tw=new Date().getDay(), pk=state.wdPick;
  const strip=`<div class="week">${WEEK.map(wd=>{ const d=dayForWeekday(wd);
    return `<button class="wd ${wd===tw?"today":""} ${d?"on":""}" data-act="wd-pick" data-wd="${wd}" aria-pressed="${pk===wd}"><span class="label">${nameOf("weekday",WD[wd])}</span><span class="wdn">${d?esc(nameOf("day",d.name)):t("Rest")}</span></button>`; }).join("")}</div>`;
  let picker="";
  if(pk!=null){ const cur=dayForWeekday(pk);
    picker=`<div class="card"><div class="row"><b class="grow">${esc(t("Plan for {day}",{day:nameOf("weekday",WD[pk])}))}</b><button class="btn ghost small" data-act="wd-close" aria-label="Close">✕</button></div>
      <div class="chips">${state.days.map(d=>`<button class="chip" data-act="wd-set" data-wd="${pk}" data-id="${esc(d.id)}" aria-pressed="${!!cur&&cur.id===d.id}">${esc(nameOf("day",d.name))}</button>`).join("")}<button class="chip" data-act="wd-set" data-wd="${pk}" data-id="" aria-pressed="${!cur}">${esc(t("Rest"))}</button></div></div>`; }
  return tip+strip+picker;
}
/* ---------- DELETE MY ACCOUNT ---------- */
function renderDelete(){
  const d=state.del||(state.del={mode:"idle",cur:null,done:[],fail:null}), el=$("#view-delete"), offline=navigator.onLine===false;
  let h=`<h2>Delete my account</h2><div class="card"><p style="margin:0">This permanently removes:</p><ul class="cardio-list"><li>Your workouts, body data, food and settings</li><li>Your shared profile and username</li><li>Your friendships and blocks</li><li>Your challenges</li><li>Your sign-in account</li></ul><p class="prev" style="margin:0">Reports you filed about others are kept. This cannot be undone.</p><div class="row"><button class="btn small" data-act="del-backup">Download backup</button></div></div>`;
  if(d.mode==="running"||d.mode==="failed"){
    h+=`<div class="card"><ul class="cardio-list">${wipePlan({hasProfile:!!state.share.profile||d.done.includes("share")||d.cur==="share"}).map(x=>`<li>${d.done.includes(x.id)?"✓ ":d.cur===x.id?(d.mode==="failed"?"✗ ":"… "):""}${esc(t(x.label))}</li>`).join("")}</ul></div>`;
  }
  if(d.mode==="failed"){
    const f=d.fail||{}, late=f.step==="account"||f.step==="device";
    h+=`<div class="card"><span>${esc(t(f.reason==="cancelled"?"Sign-in was cancelled.":f.reason==="popup"?"Your browser blocked the sign-in window. Allow pop-ups for this site, or open Iron Log in your browser, and try again.":f.reason==="mismatch"?"Choose the same Google account you signed in with.":f.reason==="offline"?"You're offline. Try again when you're back online.":late?"Your data is removed, but the sign-in account could not be deleted. Reload the app and open Delete my account again.":"Couldn't delete everything. Some of your data may already be removed. Try again."))}</span><div class="row">${late?`<button class="btn small primary" data-act="del-reload">Reload</button>`:`<button class="btn small danger" data-act="del-yes">Retry</button>`}</div></div>`;
  }else if(d.mode==="confirm"){
    h+=`<div class="card"><span>Delete your account and all your data? This cannot be undone.</span><div class="row"><button class="btn small" data-act="del-no">Keep</button><button class="btn small danger" data-act="del-yes">Delete</button></div></div>`;
  }else if(d.mode==="idle"){
    h+=`<div class="row">${offline?`<span class="prev grow">You're offline. Try again when you're back online.</span>`:""}<button class="btn danger" data-act="del-start" ${offline?"disabled":""}>Delete everything</button></div>`;
  }
  if(d.mode!=="running") h+=`<div class="row"><button class="btn" data-act="del-back">Back</button></div>`;
  el.innerHTML=h;
}
async function runWipe(){
  const d=state.del; d.mode="running"; d.done=[]; d.cur=null; d.fail=null; renderDelete();
  const res=await store.wipeAccount(id=>{ if(d.cur) d.done.push(d.cur); d.cur=id; if(state.view==="delete") renderDelete(); });
  if(res.ok){ try{ sessionStorage.setItem("ironlog.deleted","1"); }catch(e){} location.reload(); return; }
  d.mode="failed"; d.fail=res; if(state.view==="delete") renderDelete();
}

/* ---------- JOURNEY (Plan my training) ---------- */
const JR_EXP=[["beginner","Beginner","New to lifting, or coming back after a long break"],["intermediate","Intermediate","Training regularly for about a year or more"],["advanced","Advanced","Several years of consistent training"]];
const jrSteps=()=>["goal","split","days","gym","experience",...(needsAbout(state.profile)?["about"]:[]),"preview"];
// The equipment the plan is built for: the list ticked here (undefined = every exercise).
const JR_FAMILY_SUB={full:"Every muscle each session · 2–3 days","upper-lower":"Upper body and lower body days · 2, 4 or 6 days",ppl:"Push, pull and leg days · 3 or 6 days",bro:"One muscle group a day · 5 days"};
// Days offered for the picked split (any of 2-6 when no split is picked), and the one closest to the goal's usual.
const jrDayChoices=()=>{ const f=SPLIT_FAMILIES.find(x=>x.id===state.journey.family); return f?f.days:[2,3,4,5,6]; };
function jrFixDays(){ const j=state.journey, ch=jrDayChoices(); if(ch.includes(j.days)) return; const want=GOAL_DEFAULT_DAYS[j.goal]||3; j.days=ch.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a); }
function jrGym(){ const j=state.journey; return j.gymNone?undefined:j.gym; }
function openJourney(fromAuto){
  const g=GOAL_DEFAULT_DAYS[state.profile.goal]!==undefined?state.profile.goal:null;
  state.journey={step:0,goal:g,days:g?GOAL_DEFAULT_DAYS[g]:3,daysTouched:false,family:undefined,split:null,gym:Array.isArray(state.settings.gym)?[...state.settings.gym]:undefined,gymTouched:false,gymNone:false,experience:null,about:{sex:state.profile.sex||"",height:"",birthYear:""},busy:false,fromAuto:!!fromAuto};
  history.pushState({journey:1},"");
  go("journey");
}
function markJourneySkipped(){ try{ localStorage.setItem("ironlog.journey","skip"); }catch(e){} }
// Leaves the journey without saving. The history entry it pushed is popped (the popstate handler then finds nothing to close).
function endJourney(){ state.journey=null; if(history.state&&history.state.journey) history.back(); }
window.addEventListener("popstate",()=>{ if(state.journey&&!(history.state&&history.state.journey)){ if(state.journey.fromAuto) markJourneySkipped(); state.journey=null; if(state.view==="journey") go("log"); } });
function maybeStartJourney(){
  let skipped=false; try{ skipped=localStorage.getItem("ironlog.journey")==="skip"||sessionStorage.getItem("ironlog.wiping")==="1"; }catch(e){}
  if(!shouldAutoJourney({authed:state.authed,synced:state.serverSynced===true,days:state.days,workouts:state.workouts,skipped,shown:state.journeyShown})) return;
  state.journeyShown=true; openJourney(true);
}
function journeyCard(){
  return `<div class="card"><h3>Plan my training</h3><p class="prev" style="margin:0">Answer 4 quick questions and get a week that fits you.</p><div class="row"><button class="btn primary" data-act="journey-open">Start</button></div></div>`;
}
function jrOpt(act,v,on,label,sub){ return `<button class="jr-opt" data-act="${act}" data-v="${esc(v)}" aria-pressed="${on}">${label}${sub?`<small>${esc(t(sub))}</small>`:""}</button>`; }
// The split to build: the one tapped on the preview, else the picked split for these days, else the default for the days.
function jrSplitId(j,opts){ if(opts.some(o=>o.id===j.split)) return j.split; const f=j.family?splitFor(j.family,j.days):null; return f&&opts.some(o=>o.id===f)?f:opts[0].id; }
function jrPreview(j){
  const opts=splitOptions(j.days,j.experience), sid=jrSplitId(j,opts);
  const plan=buildPlan({goal:j.goal,daysPerWeek:j.days,experience:j.experience,gym:jrGym(),splitId:sid});
  const gym=jrGym(), preset=Array.isArray(gym)?GYM_PRESETS.find(p=>sameGym(gym,p.equipment)):null;
  const label=preset?t(preset.name):Array.isArray(gym)?t("your My Gym list"):t("every exercise");
  let h=`<h2>Your week</h2><span class="label">Split</span><div class="chips">${opts.map(o=>`<button class="chip" data-act="jr-split" data-v="${o.id}" aria-pressed="${o.id===sid}">${esc(t(o.name))}</button>`).join("")}</div><p class="prev" style="margin:0">${esc(t("Planned for: {x}",{x:label}))}</p>`;
  if(state.days.length) h+=`<p class="prev" style="margin:0">This replaces your current training days. Your workout history stays.</p>`;
  h+=plan.days.map(d=>`<div class="card"><div class="row"><b class="grow">${esc(nameOf("day",d.name))}</b><span class="prev">${d.weekdays.map(x=>esc(nameOf("weekday",WD[x]))).join(" · ")}</span></div><span class="prev">${d.exercises.map(n=>esc(nameOf("ex",n))).join(" · ")}</span></div>`).join("");
  h+=plan.notes.map(n=>`<p class="prev" style="margin:0">${esc(t(n.text,{...n.params,...(n.params.muscle?{muscle:nameOf("muscle",n.params.muscle)}:{}),...(n.params.day?{day:nameOf("day",n.params.day)}:{})}))}</p>`).join("");
  return {h,empty:!plan.days.length};
}
function renderJourney(){
  const j=state.journey, el=$("#view-journey");
  if(!j){ state.view="log"; render(); return; }
  const steps=jrSteps(), key=steps[j.step];
  let body="", canNext=true;
  if(key==="goal"){ canNext=!!j.goal;
    body=`<h2>What's your main goal?</h2><div class="stack" style="gap:8px">${Object.entries(GOALS).map(([k,v])=>jrOpt("jr-goal",k,j.goal===k,esc(nameOf("goal",v)))).join("")}</div>`; }
  else if(key==="split"){ canNext=j.family!==undefined;
    body=`<h2>Which split do you want?</h2><div class="stack" style="gap:8px">${SPLIT_FAMILIES.map(f=>jrOpt("jr-family",f.id,j.family===f.id,esc(t(f.name)),JR_FAMILY_SUB[f.id])).join("")}${jrOpt("jr-family","auto",j.family===null,esc(t("Not sure, suggest one")),"Based on how many days you can train")}</div>`; }
  else if(key==="days"){
    body=`<h2>How many days a week can you train?</h2><div class="chips">${jrDayChoices().map(n=>`<button class="chip" data-act="jr-days" data-v="${n}" aria-pressed="${j.days===n}">${n}</button>`).join("")}</div><p class="prev">Most people do well with 3–5 days.</p>`; }
  else if(key==="gym"){
    const on=new Set(Array.isArray(j.gym)?j.gym:[]), c=gymCounts(j.gym);
    body=`<h2>Where will you train?</h2><p class="prev" style="margin:0">Tick the equipment your gym has, or start from a preset.</p>
      <div class="chips">${GYM_PRESETS.map(p=>`<button class="chip" data-act="jr-gym" data-v="${p.id}" aria-pressed="${!j.gymNone&&sameGym(j.gym,p.equipment)}">${esc(t(p.name))}</button>`).join("")}<button class="chip" data-act="jr-gym" data-v="none" aria-pressed="${j.gymNone}">Not sure, suggest everything</button></div>
      ${GYM_GROUPS.map(([g,label])=>`<div class="card"><h3>${label}</h3><div class="chips">${EQUIPMENT.filter(e=>e.group===g).map(e=>`<button class="chip" data-act="jr-toggle" data-id="${e.id}" aria-pressed="${!j.gymNone&&on.has(e.id)}">${esc(eqLabel(e.id))}</button>`).join("")}</div></div>`).join("")}
      <p class="prev">${j.gymNone||!Array.isArray(j.gym)?esc(t("Not set yet. Every exercise is suggested.")):esc(t("{a} of {b} items · {c} exercises available",{a:c.items,b:c.itemsTotal,c:c.exercises}))}</p>`; }
  else if(key==="experience"){ canNext=!!j.experience;
    body=`<h2>How experienced are you?</h2><div class="stack" style="gap:8px">${JR_EXP.map(([k,name,sub])=>jrOpt("jr-exp",k,j.experience===k,esc(t(name)),sub)).join("")}</div>`; }
  else if(key==="about"){
    body=`<h2>About you</h2><p class="prev" style="margin:0">This helps Coach with calories and body-fat ranges. You can skip it.</p>
      <div class="chips"><button class="chip" data-act="jr-sex" data-v="male" aria-pressed="${j.about.sex==="male"}">Male</button><button class="chip" data-act="jr-sex" data-v="female" aria-pressed="${j.about.sex==="female"}">Female</button></div>
      <label><span class="label">Height (cm)</span><input id="jr-height" inputmode="decimal" value="${esc(String(j.about.height))}"></label>
      <label><span class="label">Birth year</span><input id="jr-year" inputmode="numeric" maxlength="4" value="${esc(String(j.about.birthYear))}"></label>`; }
  else { const p=jrPreview(j); body=p.h; canNext=!p.empty; }
  const last=key==="preview";
  el.innerHTML=`<div class="row"><div class="jr-dots grow" aria-hidden="true">${steps.map((s,i)=>`<span class="jr-dot ${i===j.step?"on":""}"></span>`).join("")}</div>${last?"":`<button class="btn ghost small" data-act="jr-skip">Skip</button>`}</div>
    ${body}
    <div class="row">${j.step>0?`<button class="btn" data-act="jr-back">Back</button>`:""}<span class="grow"></span>${last?`<button class="btn primary" data-act="jr-start" ${canNext&&!j.busy?"":"disabled"}>Start</button>`:`<button class="btn primary" data-act="jr-next" ${canNext?"":"disabled"}>Next</button>`}</div>`;
}
function journeyNext(){
  const j=state.journey, key=jrSteps()[j.step];
  if(key==="about"){
    const a=j.about, any=String(a.height).trim()||String(a.birthYear).trim()||a.sex!==(state.profile.sex||"");
    if(any&&!checkProfile({sex:a.sex,height:a.height,birthYear:a.birthYear,goal:j.goal},new Date().getFullYear()).ok){ toast(t("Fill in all four fields: height in cm (100–250) and a 4-digit birth year")); return; }
    if(!any) j.about={sex:state.profile.sex||"",height:"",birthYear:""};
  }
  j.step++; renderJourney(); window.scrollTo(0,0);
}
function journeyStart(){
  const j=state.journey; if(!j||j.busy) return; j.busy=true;
  const opts=splitOptions(j.days,j.experience), sid=jrSplitId(j,opts);
  const plan=buildPlan({goal:j.goal,daysPerWeek:j.days,experience:j.experience,gym:jrGym(),splitId:sid});
  if(!plan.days.length){ j.busy=false; toast(t("No plan fits this gym. Pick a bigger gym and try again.")); return; }
  store.saveDays(plan.days.map(d=>({id:uid(),...d})));
  store.saveProfile(mergeProfile(state.profile,{goal:j.goal,...j.about}));
  if(j.gymTouched&&!j.gymNone&&Array.isArray(j.gym)) store.saveSettings({gym:[...j.gym]});
  state.openEx=undefined; state.pickSplit=false; state.editDay=null; endJourney(); go("log"); toast(t("Your plan is ready"));
}

/* ---------- MY GYM ---------- */

// Taps change the setting at once (suggestions follow); the Firestore write waits for a pause in tapping.
function setGym(next){

// One-time card on the Days tab until the person sets their gym (or says "Not now" on this device).
// "Not now", "Set up" and "Show everything" all end the hint for good (this session even if storage is blocked).
function dismissGymHint(){ state.gymHintNo=true; try{ localStorage.setItem("ironlog.gymHint","1"); }catch(e){} }
function gymHintHtml(){
  let dismissed=!!state.gymHintNo; try{ dismissed=dismissed||localStorage.getItem("ironlog.gymHint")==="1"; }catch(e){}

function flushGym(){

function renderDays(){

      <p class="prev" style="margin:0">${tn("This replaces your {n} current day. Workouts you already logged stay in History and Lifts.","This replaces your {n} current days. Workouts you already logged stay in History and Lifts.",state.days.length)}</p>
      ${tpl?`<div class="row"><span class="grow">${t("Replace your days with {name}?",{name:"<b>"+esc(nameOf("template",tpl.name))+"</b>"})}</span><button class="btn small" data-act="cancel-tpl">Back</button><button class="btn small primary" data-act="apply-tpl">Replace</button></div>`:tplGrid(true)}

  }

// Keep today's workout in step with edits to its training day:
// new exercises are added, removed ones go if no sets were logged, order follows the day.
function syncTodayWithDay(day){
  const w=workoutFor(today()); if(!w||!day||w.dayId!==day.id) return;
  const nw=clone(w); nw.dayName=day.name;
  const byName=n=>nw.entries.find(e=>same(e.ex,n));
  const planned=day.exercises.map(n=>byName(n)||{ex:n,sets:[]});
  const extras=nw.entries.filter(e=>!day.exercises.some(n=>same(n,e.ex)) && (e.sets.length||e.done));
  const next=planned.concat(extras);
  if (JSON.stringify(next)!==JSON.stringify(nw.entries) || w.dayName!==day.name){ nw.entries=next; store.save(nw); }
}
function editDays(fn, opts){ const days=clone(state.days); fn(days); store.saveDays(days); days.forEach(syncTodayWithDay); if(!(opts&&opts.quiet)) renderDays(); }

  const pts=sess.map(s=>{ let best=0,top=0; s.sets.forEach(x=>{best=Math.max(best,e1rm(x.w,x.r)); top=Math.max(top,x.w);}); return {date:s.date,e1:best,top,sets:s.sets}; });
  const allBest=Math.max(...pts.map(p=>p.e1)), allTop=Math.max(...pts.map(p=>p.top));

    <div class="stat"><div class="label">Sessions</div><div class="v">${pts.length}</div></div>

  </div>

  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Sets (kg×reps)</th><th class="r">e1RM</th></tr></thead><tbody>${
    lifts.shown.map(p=>`<tr><td style="white-space:nowrap">${fmtDate(p.date)}</td><td class="num" style="font-size:13px">${p.sets.map(s=>kg(s.w)+"×"+s.r).join(" · ")}</td><td class="r num">${kg(Math.round(p.e1*10)/10)}${p.e1===allBest?'<span class="pr">PR</span>':""}</td></tr>`).join("")

function chart(pts){
  return lineChart(pts,[{k:"e1",c:"var(--accent)",main:true},{k:"top",c:"var(--muted)",dash:true}],t("Estimated 1RM and top set weight over time"),t("One session logged. The chart appears after your second."));
}
function lineChart(all, series, aria, emptyMsg){
  const W=360,H=220,L=40,R=10,T=12,B=28;
  const has=(p,k)=>typeof p[k]==="number"&&isFinite(p[k]);
  const pts=all.filter(p=>series.some(s=>has(p,s.k)));
  if(pts.length<2) return `<div class="empty" style="padding:16px">${emptyMsg}</div>`;
  const vals=pts.flatMap(p=>series.filter(s=>has(p,s.k)).map(s=>p[s.k]));
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.12||Math.max(1,hi*0.05); lo=Math.max(0,lo-pad); hi=hi+pad;
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const t0=+new Date(pts[0].date), t1=+new Date(pts[pts.length-1].date);
  const x=d=>L+((+new Date(d)-t0)/((t1-t0)||1))*(W-L-R);
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g="";
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--f-num)">${kg(Math.round(v*10)/10)}</text>`; }
  const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  idx.forEach((i,k)=>{ const a=k===0?"start":(i===pts.length-1?"end":"middle"); g+=`<text x="${x(pts[i].date)}" y="${H-8}" text-anchor="${a}" font-size="12" fill="var(--muted)">${fmtDateY(pts[i].date)}</text>`; });
  let marks="";
  series.forEach(s=>{
    const sp=pts.filter(p=>has(p,s.k)); if(!sp.length) return;
    const d=sp.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+","+y(p[s.k]).toFixed(1)).join("");
    if(s.main){
      marks+=`<path d="${d}L${x(sp[sp.length-1].date)},${y(lo)}L${x(sp[0].date)},${y(lo)}Z" fill="${s.c}" fill-opacity=".1"/>`;
      marks+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round"/>`;
      marks+=sp.map(p=>`<circle cx="${x(p.date)}" cy="${y(p[s.k])}" r="3" fill="${s.c}"/>`).join("");
      const lp=sp[sp.length-1]; marks+=`<circle cx="${x(lp.date)}" cy="${y(lp[s.k])}" r="6" fill="var(--surface)" stroke="${s.c}" stroke-width="2.5"/>`;
    } else marks+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.5" ${s.dash?'stroke-dasharray="4 4"':""}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}${marks}</svg>`;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function barChart(bars,{target=null,aria,emptyMsg,fmt=v=>String(v)}){

  const W=360,H=190,L=10,R=10,T=24,B=26, n=bars.length, hasT=Number.isFinite(target)&&target>0;
  const max=Math.max(1,...bars.map(b=>b.value||0),hasT?target:0)*1.1, bw=(W-L-R)/n, y=v=>T+(1-v/max)*(H-T-B);

  });
  if(hasT) g+=`<line x1="${L}" x2="${W-R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}" style="direction:ltr">${g}</svg>`;
}

const MUSCLE_OF = {}; Object.entries(LIB).forEach(([m,list])=>list.forEach(n=>{ if(!MUSCLE_OF[n.toLowerCase()]) MUSCLE_OF[n.toLowerCase()]=m; }));
const ACCESSORY_MAP = {"bicep curl":"Biceps","deadlift":"Back","squat":"Quads"};
const muscleOf = n => MUSCLE_OF[n.toLowerCase()] || ACCESSORY_MAP[n.toLowerCase()] || null;
const daysAgo = d => (Date.now()-new Date(d+"T12:00:00"))/864e5;
const r1 = n => Math.round(n*10)/10;

function weeklySets(){
  const counts={}; MUSCLES.forEach(m=>counts[m]=0);
  state.workouts.filter(w=>daysAgo(w.date)<7).forEach(w=>w.entries.forEach(e=>{ const m=muscleOf(e.ex); if(m) counts[m]+=countedSets(e.sets).length; }));
  return counts;
}
function weightTrend(){
  const s=bodySorted().filter(e=>typeof e.weight==="number" && daysAgo(e.date)<=35);
  if(s.length<2) return null;
  const t0=+new Date(s[0].date), xs=s.map(e=>(+new Date(e.date)-t0)/864e5), ys=s.map(e=>e.weight);
  if(xs[xs.length-1]<7) return null;
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  const perWeek=slope*7; return {perWeek, pct:perWeek/ys[ys.length-1]*100, n:s.length};
}
function insights(){
  const out=[], p=state.profile, goal=p.goal;
  const add=(sec,tone,title,text,chips)=>out.push({sec,tone,title,text,chips});
  const names=(list,kind)=>list.map(n=>nameOf(kind,n)).join(isRtl()?"، ":", ");

  // Body weight trend vs goal
  const tr=weightTrend();
  if(tr){
    const pct=r1(tr.pct), wk=r1(tr.perWeek);
    const desc=t("Over the last few weeks your weight is changing by about <b>{wk} kg/week</b> ({pct}% of body weight).",{wk:(wk>0?"+":"")+wk,pct:(pct>0?"+":"")+pct});
    if(goal==="fat-loss"){
      if(tr.pct>-0.25) add("Body","warn",t("Fat loss has stalled"),desc+" "+t("For steady fat loss, aim for 0.5–1% per week. Cut about 200–300 kcal a day or add 2–3k daily steps."));
      else if(tr.pct<-1.1) add("Body","warn",t("You're losing weight quickly"),desc+" "+t("Faster than about 1% a week makes it harder to keep muscle. Add roughly 200 kcal a day and keep protein high."));
      else add("Body","good",t("Fat loss is on pace"),desc+" "+t("That's in the 0.5–1% per week sweet spot. Keep doing what you're doing."));
    } else if(goal==="muscle"){
      if(tr.pct<0.1) add("Body","warn",t("Not gaining enough to build muscle"),desc+" "+t("A lean bulk works best at about 0.25–0.5% per week. Add roughly 200–250 kcal a day."));
      else if(tr.pct>0.6) add("Body","warn",t("Gaining faster than needed"),desc+" "+t("Above about 0.5% a week most of the extra is fat. Pull back about 150–200 kcal a day."));
      else add("Body","good",t("Lean bulk is on pace"),desc+" "+t("That's a good rate for adding muscle while limiting fat gain."));
    } else if(goal){
      if(Math.abs(tr.pct)<=0.3) add("Body","good",t("Weight is stable"),desc+" "+t("That fits a {goal} goal.",{goal:nameOf("goal",GOALS[goal]).toLowerCase()}));
      else add("Body","info",t("Weight is drifting"),desc+" "+t("For a \"{goal}\" goal you'd expect roughly stable weight. Check if that's intentional.",{goal:nameOf("goal",GOALS[goal])}));
    }
  } else if(!state.body.some(e=>typeof e.weight==="number")) add("Body","info",t("Start tracking body weight"),t("Weigh yourself 2–4 times a week, in the morning after the bathroom. After about a week the Coach can tell whether you're on pace for your goal."));

  // InBody composition
  const scans=bodySorted().filter(e=>typeof e.smm==="number"||typeof e.pbf==="number");
  if(scans.length){
    const s=scans[scans.length-1];
    if(typeof s.pbf==="number" && p.sex){
      const [lo,hi]=p.sex==="male"?[10,20]:[18,28];
      if(s.pbf>hi) add("Body","info",t("Body fat {n}% is above the typical {lo}–{hi}% range",{n:s.pbf,lo,hi}),t("Your latest scan ({d}) puts you above the usual range for {who}. A modest calorie deficit with heavy lifting and high protein brings this down while keeping muscle.",{d:fmtDate(s.date),who:p.sex==="male"?t("men"):t("women")}));
      else if(s.pbf<lo) add("Body","info",t("Body fat {n}% is below the typical {lo}–{hi}% range",{n:s.pbf,lo,hi}),t("Very lean. If energy, sleep or strength are dropping, eat closer to maintenance."));
      else add("Body","good",t("Body fat {n}% is in the typical {lo}–{hi}% range",{n:s.pbf,lo,hi}),t("Based on your scan from {d}.",{d:fmtDate(s.date)}));
    }
    if(typeof s.vfl==="number" && s.vfl>=10) add("Body","warn",t("Visceral fat level {n} is elevated",{n:s.vfl}),t("InBody flags 10 or higher. Regular cardio (about 150 minutes a week), a small calorie deficit and fewer sugary drinks help most. Worth mentioning to a doctor at your next check-up."));
    const prev=scans.slice(0,-1).reverse().find(e=>typeof e.smm==="number"&&typeof e.bfm==="number");
    if(prev && typeof s.smm==="number" && typeof s.bfm==="number"){
      const dm=r1(s.smm-prev.smm), df=r1(s.bfm-prev.bfm);
      const txt=t("Since your scan on {d}: muscle <b>{dm} kg</b>, fat <b>{df} kg</b>.",{d:fmtDate(prev.date),dm:(dm>0?"+":"")+dm,df:(df>0?"+":"")+df});
      if(dm>=0 && df<0) add("Body","good",t("Recomposition is working"),txt+" "+t("You're losing fat while keeping or adding muscle."));
      else if(dm<-0.4) add("Body","warn",t("You lost some muscle"),txt+" "+t("Keep lifting heavy, hit your protein target every day, and avoid cutting calories too fast."));
      else if(dm>0 && df>dm) add("Body","info",t("Gaining more fat than muscle"),txt+" "+t("Trim the surplus a little and make sure training volume is progressing."));
      else add("Body","info",t("Scan comparison"),txt);
    }
  }
  // Waist to height
  const wa=latestWith("waist");
  if(wa && p.height){ const r=wa.waist/p.height;
    add("Body", r<0.5?"good":"info", t("Waist-to-height ratio {r}",{r:r.toFixed(2)}), r<0.5?t("Under 0.5, the commonly used healthy cut-off."):t("0.5 or above. Bringing the waist down usually tracks with less visceral fat, so it's a good number to watch alongside the scale.")); }

  // Calories and protein targets live on the Today card (energy.js), not here.

  // Training volume per muscle
  const wk=state.workouts.filter(w=>daysAgo(w.date)<7&&trainedOn(w));
  if(state.workouts.some(trainedOn)){
    const sets=weeklySets();
    const lows=MUSCLES.filter(m=>m!=="Core"&&m!=="Calves"&&sets[m]<6).sort((a,b)=>sets[a]-sets[b]).slice(0,3);
    if(wk.length<2) add("Training","warn",tn("{n} workout in the last 7 days","{n} workouts in the last 7 days",wk.length),t("Training each muscle about twice a week gives the best results for most people. Aim for 3–4 sessions a week."));
    else add("Training","good",tn("{n} workout in the last 7 days","{n} workouts in the last 7 days",wk.length),t("Good consistency."));
    if(lows.length) add("Training","warn",t("Under-trained muscle groups"),t("These got fewer than 6 hard sets this week: <b>{list}</b>. About 10–20 sets per muscle per week works best for growth.",{list:names(lows,"muscle")}),
      lows.flatMap(m=>gymFilter(LIB[m],state.settings.gym).slice(0,2)).filter((n,i,a)=>a.indexOf(n)===i));
  }

  // Lift progress
  const stalls=[], wins=[];
  exerciseNames().forEach(ex=>{
    const s=sessionsFor(ex).map(x=>({date:x.date,b:Math.max(...x.sets.map(z=>e1rm(z.w,z.r)))}));
    if(s.length<4) return;
    const before=Math.max(...s.slice(0,-3).map(x=>x.b)), recent=Math.max(...s.slice(-3).map(x=>x.b));

  if(stalls.length) add("Training","warn",t("Stalled: {list}",{list:names(stalls.slice(0,3),"ex")}),t("No new best in the last 3 sessions. Try dropping the weight about 10% and building back up, switching rep range (for example from 5s to 8s), or adding a set. Sleep and calories matter too."));
  if(wins.length) add("Training","good",t("Progressing: {list}",{list:names(wins.slice(0,3),"ex")}),t("New bests recently. Keep adding small amounts of weight or reps each week."));
  return out;
}

// The camera picture is read on the phone and never stored or sent; only the barcode digits go to Open Food Facts.
// BarcodeDetector is used where the browser has it (Chrome on Android); otherwise the vendored ZXing library is loaded on first use.
const scanner={stream:null,timer:null,busy:false,starting:false,last:"",lastAt:0};
function stopScan(){
  clearInterval(scanner.timer); scanner.timer=null; scanner.busy=false;
  if(scanner.stream){ scanner.stream.getTracks().forEach(tr=>tr.stop()); scanner.stream=null; }
  const v=document.getElementById("scan-video"); if(v) v.srcObject=null;

function loadScanner(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  return new Promise((resolve,reject)=>{ const s=document.createElement("script"); s.src="/vendor/zxing-library.min.js"; s.onload=()=>resolve(window.ZXing); s.onerror=()=>reject(new Error("scanner")); document.head.appendChild(s); });

function scanUnavailable(){ setScanCamera("off"); setScanMsg(t("Camera not available. Type the number instead.")); }
async function startScan(){
  const sc=state.mealDraft.scan; if(!sc||scanner.starting) return;  // one camera request at a time
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ scanUnavailable(); return; }
  setScanCamera("starting"); setScanMsg(t("Starting the camera…"));
  let stream; scanner.starting=true;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); }
  catch(e){ scanner.starting=false; if(state.mealDraft.scan===sc) scanUnavailable(); else if(state.mealDraft.scan) startScan(); return; }
  scanner.starting=false;
  if(state.mealDraft.scan!==sc){ stream.getTracks().forEach(tr=>tr.stop()); if(state.mealDraft.scan) startScan(); return; }  // closed while the permission question was open (a newer scan view waits for its own camera)
  scanner.stream=stream;
  const v=document.getElementById("scan-video"); v.srcObject=stream; v.play().catch(()=>{});
  setScanCamera("on"); setScanMsg(t("Point the camera at the barcode."));
  let detect;
  try{
    if("BarcodeDetector" in window){ const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}); detect=async()=>{ const r=await det.detect(v); return r[0]?r[0].rawValue:null; }; }
    else { const Z=await loadScanner(), rd=new Z.BrowserMultiFormatReader(new Map([[Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]]])); detect=async()=>{ try{ return rd.decode(v).getText(); }catch(e){ return null; } }; }
  }catch(e){ if(scanner.stream===stream){ stopScan(); setScanCamera("off"); setScanMsg(t("Scanner not available. Type the number instead.")); } return; }
  if(scanner.stream!==stream) return;

    if(v.readyState<2||scanner.busy) return;
    scanner.busy=true;

// The same code seen again within 3 seconds is ignored (the camera keeps reading it while the lookup runs).
function onScanned(raw){

}

function finishScan(sf,digits){

  dr.scanFood=sf; dr.open={src:"scan",ref:digits}; dr.serving=e.def; dr.amount=1; dr.grams=""; dr.query=""; dr.showAll=false;

async function lookupBarcode(raw){
  const sc=state.mealDraft.scan; if(!sc||sc.busy) return;
  const d=canonicalBarcode(cleanDigits(raw));
  if(!d){ setScanMsg(t("That number isn't a valid barcode")); return; }
  const saved=state.myFoods.find(f=>f.barcode&&canonicalBarcode(f.barcode)===d);
  if(saved){ finishScan({food:saved,save:false},saved.barcode); return; }
  if(navigator.onLine===false){ toast(t("You're offline. Try again when you're back online.")); return; }
  sc.busy=true; setScanBusy(true); setScanMsg(t("Looking it up…"));
  let json=null, failed=false;
  try{ const r=await withTimeout(fetch(productUrl(d)),20000); failed=r.status>=500; try{ json=await r.json(); }catch(e){ failed=true; } }  // an answer that is not JSON is a failed lookup, not "no calories"

  sc.busy=false; setScanBusy(false); setScanMsg("");
  if(failed){ scanner.lastAt=Date.now()+12000; toast(t("Couldn't look that up. Check your connection.")); return; }  // the camera keeps seeing this code: stay quiet about it for 15 s

  const name=json&&json.product&&typeof json.product.product_name==="string"?json.product.product_name.trim().slice(0,60):"";

  toast(t("No calories on record. Type them once and it is saved."));
}

/* ---------- REST TIMER ---------- */
// state.rest = {ex, endsAt, total}. Time left is always computed from endsAt, so it stays right
// after the browser throttles a background tab. Mirrored to localStorage to survive a reload.
let restTick=null, restAlerted=false, restSaveTimer=null, audioCtx=null;
function persistRest(){ try{ if(state.rest) localStorage.setItem("ironlog.rest",JSON.stringify(state.rest)); else localStorage.removeItem("ironlog.rest"); }catch(e){} }
// Browsers only allow sound after a tap, so the audio context is created/resumed on "Add set".
function unlockAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  try{ if(!audioCtx) return;
    const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.27);
  }catch(e){}
}
function restAlert(){ try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} beep(); }
function drawRest(){
  const ph=restPhase(state.rest,Date.now());
  if(ph==="none"||ph==="expired"){ clearRest(); return; }
  const bar=$("#restbar");
  bar.hidden=false; document.body.classList.add("has-restbar"); bar.classList.toggle("go",ph==="go");
  $("#rb-label").textContent=t(ph==="go"?"Rest over · {name}":"Rest · {name}",{name:nameOf("ex",state.rest.ex)});
  $("#rb-clock").textContent=ph==="go"?t("Go"):fmtClock(remaining(state.rest.endsAt,Date.now()));
  if(ph==="go"&&!restAlerted){ restAlerted=true; restAlert(); }
}
function runRest(){ clearInterval(restTick); restTick=setInterval(drawRest,250); drawRest(); }
function startRestFor(ex){ unlockAudio(); state.rest=startRest(ex,restFor(ex,state.settings),Date.now()); restAlerted=false; persistRest(); runRest(); }
function clearRest(){ state.rest=null; restAlerted=false; persistRest(); clearInterval(restTick); restTick=null; $("#restbar").hidden=true; document.body.classList.remove("has-restbar"); }
function adjustRestBy(d){
  if(!state.rest) return;
  const now=Date.now(); let r=state.rest;
  if(restPhase(r,now)!=="resting") r=startRest(r.ex,r.total,now); // rest already over: start again from now
  state.rest=adjustRest(r,d,now); restAlerted=false; persistRest(); drawRest();
  const ex=state.rest.ex, total=state.rest.total;
  // Several quick taps = one write.
  clearTimeout(restSaveTimer); restSaveTimer=setTimeout(()=>store.saveSettings({rest:{...state.settings.rest,[ex]:total}}),1500);
}
function resumeRest(){
  let r=null; try{ r=JSON.parse(localStorage.getItem("ironlog.rest")||"null"); }catch(e){}
  const ph=restPhase(r,Date.now());
  if(ph==="resting"||ph==="go"){ state.rest=r; restAlerted=ph==="go"; runRest(); } else clearRest();
}

/* ---------- THEME ---------- */
// "system" follows the phone; light/dark override it. The <head> script applies it before first paint.
function currentTheme(){ try{ const t=localStorage.getItem("ironlog.theme"); return t==="light"||t==="dark"?t:"system"; }catch(e){ return "system"; } }
function applyTheme(setting){
  try{ localStorage.setItem("ironlog.theme",setting); }catch(e){}
  const a=themeAttr(setting);
  if(a) document.documentElement.dataset.theme=a; else delete document.documentElement.dataset.theme;
  const m=document.querySelector('meta[name="theme-color"]');
  applyAccent(currentAccent(),false);
  if(m) m.content=getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()||"#ffffff";
}
/* ---------- ACCENT ---------- */
// One chosen colour -> accent, text-on-accent and soft tint for light and dark (theme-tools.js). The result for both modes is
// cached in localStorage so the <head> script can apply it before first paint. Plate blue = the CSS defaults (nothing set).
const ACCENT_ENV={light:{surface:"#ffffff",bg:"#f3f5f9"},dark:{surface:"#171d26",bg:"#0f1319"}};
function currentAccent(){ try{ const a=localStorage.getItem("ironlog.accent"); return a&&(PRESETS.some(p=>p.id===a)||parseHex(a))?a:"plate"; }catch(e){ return "plate"; } }
function isDarkNow(){ const th=document.documentElement.dataset.theme; return th==="dark"||(th!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches); }
function applyAccent(setting,save){
  const s=PRESETS.some(p=>p.id===setting)?setting:(parseHex(setting)||"plate"), st=document.documentElement.style;
  const both={light:deriveAccent(s,"light",ACCENT_ENV.light.surface,ACCENT_ENV.light.bg),dark:deriveAccent(s,"dark",ACCENT_ENV.dark.surface,ACCENT_ENV.dark.bg)};
  if(save!==false){ try{ localStorage.setItem("ironlog.accent",s); if(s==="plate") localStorage.removeItem("ironlog.accent.css"); else localStorage.setItem("ironlog.accent.css",JSON.stringify({light:[both.light.accent,both.light.ink,both.light.soft],dark:[both.dark.accent,both.dark.ink,both.dark.soft]})); }catch(e){} }
  if(s==="plate"){ ["--accent","--accent-ink","--accent-soft"].forEach(n=>st.removeProperty(n)); return; }
  const v=both[isDarkNow()?"dark":"light"];
  st.setProperty("--accent",v.accent); st.setProperty("--accent-ink",v.ink); st.setProperty("--accent-soft",v.soft);
}
function drawSwatches(){

    `<label class="swatch custom" aria-pressed="${custom}" title="${esc(t("Custom"))}"><input type="color" id="accent-custom" value="${custom?cur:"#1f5fd1"}" aria-label="${esc(t("Custom"))}"></label>`;
}
document.addEventListener("input",e=>{ if(e.target.id==="accent-custom"){ applyAccent(e.target.value); const c=e.target.closest(".swatch"); document.querySelectorAll("#accent-swatches .swatch").forEach(b=>b.setAttribute("aria-pressed",b===c)); } });

// English / Arabic. Plain labels are swapped by trDom (also for everything drawn later, via the observer below);
// text with numbers or names goes through t()/tn() while drawing. The <head> script sets lang/dir before first paint.
function currentLang(){ try{ return detectLang(localStorage.getItem("ironlog.lang"),navigator.language); }catch(e){ return "en"; } }
function applyLang(code,quiet){
  if(!setLang(code)) return;
  try{ localStorage.setItem("ironlog.lang",code); }catch(e){}
  const de=document.documentElement; de.lang=code; de.dir=isRtl()?"rtl":"ltr";
  trDom(document.body);
  document.querySelectorAll("[data-act=lang-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===code));
  if(!quiet&&state.authed){ renderSoon(); refreshSheets(); }

// Content drawn after a language change (innerHTML in views and sheets) is translated as it is added.

    case "apply-tpl":{ const tp=TEMPLATES[state.confirmTpl]; store.saveDays(tp.days.map(d=>({id:uid(),...clone(d),weekdays:[]}))); state.confirmTpl=null; state.pickSplit=false; state.editDay=null; renderDays(); window.scrollTo(0,0); toast(t("Switched to {name}",{name:nameOf("template",tp.name)})); break; }
    case "cancel-tpl": state.confirmTpl=null; renderDays(); break;
    case "change-split": closeSheet("#plansheet"); state.pickSplit=!state.pickSplit; state.confirmTpl=null; state.confirmReset=false; renderDays(); break;
    case "wd-pick": state.wdPick=state.wdPick===+b.dataset.wd?null:+b.dataset.wd; renderDays(); break;
    case "wd-close": state.wdPick=null; renderDays(); break;
    case "wd-set": { const wd=+b.dataset.wd, did=b.dataset.id||null; state.wdPick=null; editDays(ds=>{ ds.splice(0,ds.length,...assignWeekday(ds,wd,did)); }); break; }
    case "toggle-wd": editDays(ds=>{ const x=+b.dataset.wd, d=ds.find(o=>o.id===id); d.weekdays=d.weekdays||[];
      if(d.weekdays.includes(x)) d.weekdays=d.weekdays.filter(v=>v!==x);
      else { ds.forEach(o=>{ if(o.weekdays) o.weekdays=o.weekdays.filter(v=>v!==x); }); d.weekdays.push(x); } }); break;
    case "add-day":{ closeSheet("#plansheet"); const nid=uid(); editDays(ds=>ds.push({id:nid,name:t("Day {n}",{n:ds.length+1}),focus:[],exercises:[]})); state.editDay=nid; renderDays(); setTimeout(()=>{ const el=document.getElementById("dn-"+nid); el&&(el.scrollIntoView({block:"center"}),el.select()); },0); break; }
    case "edit-day": state.editDay=state.editDay===id?null:id; state.confirmDayDel=null; renderDays(); break;
    case "toggle-m": editDays(ds=>{ const d=ds.find(x=>x.id===id), m=b.dataset.m; d.focus=d.focus.includes(m)?d.focus.filter(x=>x!==m):MUSCLES.filter(x=>x===m||d.focus.includes(x)); }); break;
    case "add-dex": editDays(ds=>ds.find(x=>x.id===id).exercises.push(b.dataset.name)); break;
    case "rm-dex": editDays(ds=>ds.find(x=>x.id===id).exercises.splice(+b.dataset.k,1)); break;
    case "mv": editDays(ds=>{ const ex=ds.find(x=>x.id===id).exercises, k=+b.dataset.k, j=k+(+b.dataset.d); [ex[k],ex[j]]=[ex[j],ex[k]]; }); break;
    case "mv-day": editDays(ds=>{ const k=ds.findIndex(x=>x.id===id), j=k+(+b.dataset.d); [ds[k],ds[j]]=[ds[j],ds[k]]; }); break;
    case "ask-ddel": state.confirmDayDel=id; renderDays(); break;
    case "cancel-ddel": state.confirmDayDel=null; renderDays(); break;
    case "del-day": state.confirmDayDel=null; state.editDay=null; editDays(ds=>ds.splice(ds.findIndex(x=>x.id===id),1)); break;
    case "ask-reset": state.confirmReset=true; renderDays(); break;
    case "cancel-reset": state.confirmReset=false; renderDays(); break;
    case "do-reset": state.confirmReset=false; state.pickSplit=false; state.editDay=null; store.saveDays([]); renderDays(); break;
    case "edit-profile": state.editProfile=true; renderBody(); break;
    case "cancel-profile": state.editProfile=false; renderBody(); break;
    case "del-body": store.removeBody(state.bdate); renderBody(); toast(t("Entry deleted")); break;
    case "goto-body": go("body"); break;
    case "coach-add":{ const keep=state.view; state.date=today(); addExerciseToWorkout(b.dataset.name); state.view=keep; toast(t("{name} added to today's workout",{name:nameOf("ex",b.dataset.name)})); renderCoach(); break; }
    case "copy-review": copyReview(); break;
    case "signin": signIn(); break;
    case "export": exportData(); break;
    case "ask-del": state.confirmDel=id; renderHistory(); break;
    case "cancel-del": state.confirmDel=null; renderHistory(); break;
    case "del-w": store.remove(id); state.confirmDel=null; renderHistory(); toast(t("Workout deleted")); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches?.("tr[data-act]")){ e.target.click(); return; } if(e.key==="Enter"){ const c=e.target.closest?.("[data-open]"); if(c&&e.target===c){ state.date=c.dataset.open; go("log"); } } });

try{ state.view=migrateView(localStorage.getItem("ironlog.view")); const tb0=tabOf(state.view); if(tb0) state.tabView[tb0]=state.view; }catch(e){}
$("#signout").addEventListener("click",()=>{ flushGym(); clearRest(); signOut(auth); });
// Sheets add history entries; restoring the old scroll position when they close would undo
// go()'s scroll-to-top (e.g. More → Lifts opening halfway down), so the app handles scrolling itself.
try{ history.scrollRestoration="manual"; }catch(e){}
window.addEventListener("offline",()=>setSync(t("Offline · saving on this phone")));
window.addEventListener("online",()=>setSync(t("Back online · syncing…")));
// iOS Safari ignores user-scalable=no: stop its pinch-zoom gesture.
for(const g of ["gesturestart","gesturechange"]) document.addEventListener(g,e=>e.preventDefault());
if ("serviceWorker" in navigator) {
  // A new version takes over by itself (skipWaiting + claim), but the page already open keeps the old code. Reload once
  // when that happens, and look for updates when the app comes back to the front; never while typing or in a sheet/flow.
  const hadController=!!navigator.serviceWorker.controller; let reloadWanted=false;
  const tryReload=()=>{ if(!reloadWanted||typing()||state.journey||document.querySelector("dialog[open]")) return; reloadWanted=false; location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadController){ reloadWanted=true; tryReload(); } });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); tryReload(); } });
  document.addEventListener("focusout",()=>setTimeout(tryReload,500));
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("Offline cache unavailable",e)));
}
if(!configured) $("#signout").hidden=true;
render();
applyTheme(currentTheme());
applyLang(currentLang(),true);
applyAccent(currentAccent(),false);
resumeRest();
// Don't redraw under someone who is typing; redraw as soon as they leave the field instead.
// Swipe left/right between the five tabs (nav.js decides the direction). Not started on inputs, steppers or anything that
// scrolls sideways, not while a dialog is open, and not on the full-screen flows (journey, delete).
let swipe=null;
const scrollsSideways=el=>{ for(let n=el;n&&n!==document.body;n=n.parentElement){
  if(n.matches&&n.matches("input,textarea,select,.bigstep,.stepper,[contenteditable]")) return true;
  if(n.scrollWidth>n.clientWidth+1){ const ox=getComputedStyle(n).overflowX; if(ox==="auto"||ox==="scroll") return true; } } return false; };
document.addEventListener("touchstart",e=>{ swipe=null;
  if(e.touches.length!==1||!state.authed||!tabOf(state.view)||document.querySelector("dialog[open]")||scrollsSideways(e.target)) return;
  swipe={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
document.addEventListener("touchcancel",()=>{ swipe=null; },{passive:true});
document.addEventListener("touchend",e=>{
  const s=swipe; swipe=null; if(!s||!e.changedTouches.length) return;
  const dir=swipeDirection({dx:e.changedTouches[0].clientX-s.x,dy:e.changedTouches[0].clientY-s.y,startX:s.x,width:window.innerWidth,rtl:isRtl()});
  const tab=dir&&neighborTab(tabOf(state.view),dir); if(!tab) return;
  go(state.tabView[tab]||TABS.find(x=>x.id===tab).views[0]);
  const el=$("#view-"+state.view); if(el){ el.classList.remove("slide-r","slide-l"); void el.offsetWidth; el.classList.add((dir>0)!==isRtl()?"slide-r":"slide-l"); }
},{passive:true});
const typing=()=>{ const a=document.activeElement; return !!(a&&a.matches&&a.matches("input:not([type=date]),select,textarea")); };
let renderPending=false;
function renderSoon(){ if(typing()){ renderPending=true; return; } renderPending=false; render(); }
// Wait a moment so a tap that moved focus (e.g. on "Add set") lands before the page is rebuilt.
document.addEventListener("focusout",()=>{ if(renderPending) setTimeout(()=>{ if(renderPending&&!typing()) renderSoon(); },400); });
// If the app stayed open past midnight, move "today" to the new day (dates picked on purpose stay).
let lastToday=today();
function checkNewDay(){
  const t=today(); if(t===lastToday) return;
  state.date=rolloverDate(state.date,lastToday,t); state.bdate=rolloverDate(state.bdate,lastToday,t); state.cdate=rolloverDate(state.cdate,lastToday,t);
  lastToday=t; stopEditing(); renderSoon(); publishProgress(false); maybePublish();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkNewDay(); else if(scanner.stream){ stopScan(); setScanCamera("off"); setScanMsg(t("Camera stopped.")); } });
setInterval(checkNewDay,60000);
try{ state.deletedNote=sessionStorage.getItem("ironlog.deleted")==="1"; sessionStorage.removeItem("ironlog.deleted"); if(state.deletedNote) sessionStorage.removeItem("ironlog.wiping"); }catch(e){}
store.init(()=>{ renderSoon(); checkBadges(); maybePublish(); refreshFriendNames(); maybeStartJourney(); publishProgress(false); });
})();
</script>
