<script>/* language + direction before the page draws */try{var l=localStorage.getItem("ironlog.lang");if(l!=="ar"&&l!=="en")l=/^ar/i.test(navigator.language||"")?"ar":"en";document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* "Clean plate": phone-first single column, soft white cards on a light steel background (navy/slate in dark), plate-blue accent, bottom tab bar */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#eef2f8; --line:#e3e8ef;
  --fg:#141a23; --muted:#5b6676; --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#dbe6fb;
  --good:#1d8a52; --danger:#c43a2f;
  --shadow:0 1px 3px rgb(20 30 50 / .08); --card-border:transparent;
  --r-card:18px; --r-btn:14px; --tabbar:64px;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171d26; --sunk:#0b0f14; --line:#283140;
  --fg:#e6ebf2; --muted:#8c97a8; --accent:#6c9cff; --accent-ink:#0b1220; --accent-soft:#1b2a47;
  --good:#4cc78a; --danger:#ff7a6e; --shadow:none; --card-border:var(--line); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171d26; --sunk:#0b0f14; --line:#283140;
  --fg:#e6ebf2; --muted:#8c97a8; --accent:#6c9cff; --accent-ink:#0b1220; --accent-soft:#1b2a47;
  --good:#4cc78a; --danger:#ff7a6e; --shadow:none; --card-border:var(--line); color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.plate{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 6px var(--accent),inset 0 0 0 8px var(--surface)}
.sync{font-size:12px;color:var(--muted);text-align:end}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;min-width:0}
.fields input{font-family:var(--f-num)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font:700 15px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);list-style-position:outside}
details[open] summary{margin-bottom:10px}
.insight{border-inline-start:3px solid var(--line);padding:2px 0;padding-inline-start:12px;display:flex;flex-direction:column;gap:6px}
.insight.good{border-inline-start-color:var(--good)} .insight.warn{border-inline-start-color:var(--danger)} .insight.info{border-inline-start-color:var(--accent)}
.insight b{font-weight:600}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.bars .track{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.bars .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:var(--accent)}
.bars .fill.low{background:var(--danger)} .bars .fill.ok{background:var(--good)}
.bars .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.ai{white-space:pre-wrap;font-size:14px;line-height:1.6}
main{padding-block:18px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:14;display:flex;justify-content:space-around;align-items:stretch;background:var(--surface);border-top:1px solid var(--line);height:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{appearance:none;border:0;background:none;color:var(--muted);flex:1;max-width:128px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px/1 var(--f-body);cursor:pointer}
.tabbar svg{width:24px;height:24px}
/* Workout focus mode */
.exchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.exchips::-webkit-scrollbar{display:none}
.exchip{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 6px;border-radius:999px;border:1px solid var(--card-border);background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font:600 13px/1 var(--f-body);cursor:pointer}
.exchip .t{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exchip .n{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.exchip.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.exchip.started .n{border-color:var(--accent);color:var(--accent)}
.exchip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exchip[aria-current="true"] .n{border-color:var(--accent-ink);color:var(--accent-ink);background:transparent}
.card.focus .ex-name{font-size:26px}
.bignum{font:600 34px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.bignum small{font-size:14px;color:var(--muted);font-weight:500}
.nextbtn{overflow:hidden;text-overflow:ellipsis}
.complete-card .tick{width:34px;height:34px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;font-weight:700}
.sheet .card{box-shadow:none;border:0;padding:0;background:none}
.tabbar button[aria-current="page"]{color:var(--accent)}
.more-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:600 16px/1 var(--f-body);cursor:pointer;text-align:left}
.more-row svg{width:20px;height:20px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 14px/1 var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
/* big stepper: − value + with 48px round buttons (Workout focus mode) */
.bigstep{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:16px;padding:6px}
.bigstep button{appearance:none;flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);font:700 22px/1 var(--f-body);box-shadow:var(--shadow);cursor:pointer}
.bigstep input{flex:1;border:0;background:none;text-align:center;font:600 28px/1 var(--f-num);padding:6px 0}
.bigstep input:focus-visible{outline-offset:-2px}
.view{display:flex;flex-direction:column;gap:16px}
h2{font:700 22px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:700 16px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px/1 var(--f-body);padding:11px 14px;min-height:44px;border-radius:var(--r-btn);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.secondary{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.small,.btn.ghost{min-height:0}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:8px}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 10px;font-size:13px}
.btn:active{transform:translateY(1px)}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-name{font:700 20px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.prev{font-size:13px;color:var(--muted)}
.prev b{color:var(--fg);font-weight:500}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
tr.setrow{cursor:pointer}
tr.setrow.editing td{background:var(--accent-soft)}
.pr{display:inline-block;font:600 10px/1 var(--f-body);letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:3px 6px;border-radius:4px;margin-inline-start:6px;vertical-align:2px}
.adder{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:420px){.adder{grid-template-columns:1fr 1fr}.adder .btn{grid-column:1/-1}}
.adder label{display:flex;flex-direction:column;gap:4px;min-width:0}
.stepper{display:flex}
.stepper input{text-align:center;border-radius:0;font-family:var(--f-num)}
.stepper button{appearance:none;border:1px solid var(--line);background:var(--sunk);color:var(--fg);width:38px;flex:none;font:600 18px/1 var(--f-body);cursor:pointer}
.stepper button:first-child{border-radius:8px 0 0 8px;border-right:0}
.stepper button:last-child{border-radius:0 8px 8px 0;border-left:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:14px;padding:12px}
.stat .v{font:600 22px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}
.chart{width:100%;height:auto;display:block}
/* right-to-left (Arabic): mirror arrows; keep steppers, charts and numeric fields left-to-right */
[dir="rtl"] .more-row svg{transform:scaleX(-1)}
[dir="rtl"] .bigstep,[dir="rtl"] .stepper,[dir="rtl"] .chart,[dir="rtl"] .bars .track{direction:ltr}
[dir="rtl"] input[inputmode="decimal"],[dir="rtl"] input[inputmode="numeric"],[dir="rtl"] input[type="number"]{direction:ltr;text-align:right}
:root[lang="ar"]{--f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;--f-display:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
:root[lang="ar"] .dayname,:root[lang="ar"] .daytag,:root[lang="ar"] .label,:root[lang="ar"] .badge,:root[lang="ar"] .pr{text-transform:none;letter-spacing:0}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{display:block;color:var(--fg);font:700 18px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--sunk);border-radius:999px;padding:3px 10px;color:var(--muted)}
button.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px/1.2 var(--f-body);padding:7px 12px;cursor:pointer}
button.chip.add::before{content:"+ ";color:var(--accent);font-weight:600}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{inset:auto;margin:0;border:0;position:fixed;left:50%;bottom:calc(var(--tabbar) + 12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
/* day picker */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.daypick{appearance:none;text-align:start;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.daypick.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.daynum{font:600 11px/1 var(--f-num);letter-spacing:.06em;color:var(--muted)}
.dayname{font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.badge{position:absolute;top:10px;inset-inline-end:10px;font:600 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 6px;border-radius:4px}
.daytag{display:inline-flex;gap:8px;align-items:baseline;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 10px;font:700 15px/1.2 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.exlist li:last-child{border-bottom:0}
.exlist .n{font:600 12px/1 var(--f-num);color:var(--muted);width:22px;flex:none}
.exlist .t{flex:1;min-width:0;overflow-wrap:anywhere}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tpl .daypick small{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.acct{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.acct img{width:26px;height:26px;border-radius:50%}
.signin{max-width:420px;margin:40px auto;text-align:center;align-items:center}
.gbtn{display:inline-flex;align-items:center;gap:10px}
.progress{display:flex;flex-direction:column;gap:6px}
.progress .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress .fill{height:100%;background:var(--good);border-radius:3px;transition:width .3s}
.exrow{appearance:none;width:100%;text-align:start;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.exrow .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 14px/1 var(--f-body);color:var(--muted)}
.exrow.done{background:var(--sunk);border-color:transparent}
.exrow.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.exrow.started .tick{border-color:var(--accent);color:var(--accent)}
.exrow .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exrow .nm{font:700 17px/1.15 var(--f-display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.exrow.done .nm{color:var(--muted)}
.exrow .sm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exrow .chev{flex:none;color:var(--muted);font-size:18px}
.card.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.complete{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--good);border-radius:10px;padding:14px}
.complete b{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-width:0}
.wd .wdn{font:600 12px/1.2 var(--f-body);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.wd.on .wdn{color:var(--fg)}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dayhead{appearance:none;border:0;background:none;padding:0;margin:0;color:inherit;font:inherit;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.brand svg{width:30px;height:30px;flex:none;border-radius:8px}
/* rest timer bar, pinned to the bottom on every tab */
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .08);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.restbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.restbar .rb-label{flex:1 1 auto;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.restbar .rb-clock{font-size:24px;font-weight:600;min-width:4.2ch;text-align:end}
.restbar .btn{padding:9px 10px;font-size:13px}
.restbar.go{background:var(--accent);border-top-color:var(--accent)}
.restbar.go .rb-label,.restbar.go .rb-clock{color:var(--accent-ink)}
.restbar.go .btn{background:transparent;border-color:var(--accent-ink);color:var(--accent-ink)}
body.has-restbar main{padding-bottom:calc(var(--tabbar) + 96px + env(safe-area-inset-bottom,0px))}
body.has-restbar .toast{bottom:calc(var(--tabbar) + 84px + env(safe-area-inset-bottom,0px))}
/* exercise info bottom sheet */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:640px;max-height:85vh;overflow:auto;border:0;border-radius:16px 16px 0 0;background:var(--surface);color:var(--fg);box-shadow:0 -8px 32px rgb(0 0 0 / .2);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
dialog.sheet::backdrop{background:rgb(0 0 0 / .45)}
.sheet-head{display:flex;align-items:flex-start;gap:8px}
.sheet-head h2{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;padding-top:4px}
.ex-figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.ex-figs figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.ex-fig{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);display:grid;place-items:center;overflow:hidden;padding:6px;text-align:center}
.ex-fig svg{width:100%;height:100%;display:block}
.ex-fig .exbg{fill:var(--surface)}
.ex-works{margin:10px 0 4px}
.ex-tips{margin:6px 0 10px;padding-inline-start:20px}
.ex-tips li{margin:3px 0}
.ex-credit{margin:0;font-size:12px}
.stat .v.good{color:var(--good)}
.today .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today .stat{padding:10px}
.today .stat .v{font-size:19px}
.today .stat .v small{display:block;margin-top:2px}
.ebar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.ebar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meal-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meal-fields label{display:flex;flex-direction:column;gap:4px;min-width:0}
.meal-fields .meal-name{grid-column:1/-1}
.gbar{display:flex;flex-direction:column;gap:4px}
.dots{letter-spacing:2px;color:var(--accent)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border:1px solid var(--card-border);border-radius:14px;box-shadow:var(--shadow);background:var(--surface)}
.ach .medal{width:30px;height:30px;border-radius:50%;background:var(--sunk);border:3px solid var(--line)}
.ach.on .medal{background:var(--accent);border-color:var(--accent-soft)}
.ach .bname{font-weight:600;font-size:13px;line-height:1.2}
.ach:not(.on) .bname{color:var(--muted)}
.ach .bsub{font-size:11px;line-height:1.3}
.cardio-adder{grid-template-columns:1fr 1fr}
.cardio-adder .btn{grid-column:1/-1}
.cardio-list{list-style:none;margin:0;padding:0}
.cardio-list li{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.cardio-list li:last-child{border-bottom:0}
/* "!" exercise info buttons: small visible circle, 44px tap area */
.infobtn{appearance:none;border:0;background:none;color:var(--muted);padding:11px;margin:-11px 0;flex:none;cursor:pointer;display:grid;place-items:center;font:inherit}
.infobtn .ib{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:700 13px/1 var(--f-body)}
.infobtn:hover,.infobtn:focus-visible{color:var(--accent)}
.ex-head > .infobtn{margin-inline-end:auto;margin-inline-start:-6px}
.exrow-wrap{position:relative}
.exrow-wrap .exrow .meta{margin-inline-end:34px}
.exrow-wrap .infobtn{position:absolute;inset-inline-end:26px;top:50%;margin:0;transform:translateY(-50%)}
.chipgrp{display:inline-flex;align-items:center}
.chipgrp .infobtn{padding:2px 4px;margin:0;position:relative}
.chipgrp .infobtn::after{content:"";position:absolute;inset:-10px -4px}
.chipgrp .infobtn .ib{width:20px;height:20px;font-size:12px}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { prefillFor, restFor, startRest, adjustRest, remaining, restPhase, fmtClock, shouldWake, createWakeLock, editIndexFor, rolloverDate, trainedOn, nextUnfinished, elapsedMin } from "./workout-tools.js";
import { cleanBackupItems } from "./backup.js";
import { themeAttr, sortTips, withWeight } from "./ui-helpers.js";
import { CARDIO_TYPES, INTENSITIES, weightOn, cardioKcal, exerciseKcal, bmrFor, dayEnergy } from "./energy.js";
import { badges, xpSummary, goalProgress, trainingStreak, foodStreak } from "./achievements.js";
import { LIB, MUSCLES, ALL_EX, TEMPLATES, migrateProgram, PROGRAM_VERSION, resolveAlias } from "./exercise-library.js";
import { infoFor } from "./exercise-info.js";
import { registerLang, setLang, isRtl, detectLang, t, tn, nameOf, locale, trDom } from "./i18n.js";
import { AR } from "./lang-ar.js";
(function(){
/* exercise library (LIB, MUSCLES, ALL_EX, TEMPLATES) lives in exercise-library.js */

registerLang("ar",AR);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString(locale(),{weekday:"short",day:"numeric",month:"short"});
const fmtDateY = d => new Date(d+"T12:00:00").toLocaleDateString(locale(),{day:"numeric",month:"short",year:"numeric"});
const kg = n => (Math.round(n*100)/100).toString();
const e1rm = (w,r) => r<=0||w<=0 ? 0 : (r===1 ? w : w*(1+r/30));
const vol = sets => sets.reduce((a,s)=>a+s.w*s.r,0);
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a,b) => a.toLowerCase()===b.toLowerCase();

let state = { workouts:[], days:[], body:[], profile:{}, view:"log", date:today(), bdate:today(), metric:"weight", progressEx:null, confirmDel:null, editDay:null, confirmReset:false, confirmDayDel:null, pickDay:false, editProfile:false, authed:false, setup:false, settings:{rest:{}}, food:{}, cardioDraft:{type:"treadmill",min:"20",intensity:"moderate",kcal:""}, cdate:today(), mealDraft:{kcal:"",protein:"",name:""}, rest:null, editSet:null };
const ui = {};

/* ---------- storage: Firebase Auth + Firestore (users/{uid}/items/{id}) ---------- */
const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("PASTE");
let app=null, auth=null, fs=null;
if (configured) {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}
const store = {
  col:null, unsub:null, user:null,
  init(onData){
    if (!configured){ state.authed=false; state.setup=true; setSync(""); onData(); return; }
    getRedirectResult(auth).catch(e=>toast(signInError(e)));
    onAuthStateChanged(auth, user=>{
      if (this.unsub){ this.unsub(); this.unsub=null; }
      this.user=user; state.authed=!!user;
      showAccount(user);
      if (!user){ state.workouts=[]; state.days=[]; state.body=[]; state.profile={}; state.settings={rest:{}}; state.food={}; state.serverSynced=false; setSync(""); onData(); return; }
      setSync("Loading your data…");
      this.col = collection(fs, "users", user.uid, "items");
      this.unsub = onSnapshot(this.col, { includeMetadataChanges:true }, snap=>{
        const ws=[], bs=[], food={}; let prog={}, prof={}, settings={rest:{}};
        snap.docs.forEach(d=>{ const v=d.data();
          if(d.id==="program") prog=v; else if(d.id==="profile") prof=v; else if(d.id==="settings") settings={rest:v.rest||{}, ...(Array.isArray(v.seenBadges)?{seenBadges:v.seenBadges}:{})}; else if(d.id.startsWith("b-")) bs.push(v); else if(d.id.startsWith("f-")) food[d.id.slice(2)]={date:d.id.slice(2),meals:v.meals||[]}; else if(d.id.startsWith("w-")) ws.push({id:d.id,...v}); });
        // One-time fix for days missing muscle tags. Only on server data, so a stale offline copy never overwrites newer edits.
        const mp=migrateProgram(prog), days=mp.days;
        state.workouts=ws; state.days=days; state.body=bs; state.profile=prof; state.settings=settings; state.food=food; state.serverSynced=!snap.metadata.fromCache;
        if(snap.docChanges().length) state.dataRev=(state.dataRev||0)+1;  // metadata-only snapshots ("saved") change nothing
        if(mp.needsSave && !snap.metadata.fromCache) this.saveDays(days);
        setSync(snap.metadata.hasPendingWrites ? (navigator.onLine===false?"Offline · will sync":"Saving…") : (snap.metadata.fromCache?"Offline":"Synced"));
        onData();
      }, err=>{ setSync("Sync stopped. Reload to reconnect"); console.error(err); });
    });
  },
  write(id, body){
    if (!this.col) return;
    const ref = doc(this.col, id);
    (body ? setDoc(ref, body) : deleteDoc(ref)).catch(e=>{
      console.error(e);
      toast(e && e.code==="permission-denied" ? "Not allowed to save. Sign out and back in." : e && e.code==="resource-exhausted" ? "Daily free limit reached. Changes will save tomorrow." : "Couldn't save. Check your connection.");
    });
  },
  save(w){
    w.updated=Date.now();
    const i=state.workouts.findIndex(x=>x.id===w.id); if(i<0) state.workouts.push(w); else state.workouts[i]=w;
    const body={date:w.date,dayId:w.dayId||null,dayName:w.dayName||null,entries:w.entries,updated:w.updated};
    if(w.cardio) body.cardio=w.cardio;  // only when present: Firestore rejects undefined
    this.write(w.id,body);
  },
  remove(id){ state.workouts=state.workouts.filter(w=>w.id!==id); this.write(id,null); },
  saveDays(days){ state.days=days; this.write("program",{days,v:PROGRAM_VERSION,updated:Date.now()}); },
  saveBody(entry){
    const i=state.body.findIndex(x=>x.date===entry.date); if(i<0) state.body.push(entry); else state.body[i]=entry;
    this.write("b-"+entry.date, entry);
  },
  removeBody(date){ state.body=state.body.filter(x=>x.date!==date); this.write("b-"+date,null); },
  saveProfile(p){ state.profile=p; this.write("profile",p); },
  // Whole-doc setDoc, so exercise names containing dots are safe as map keys.
  // One doc per day of meals; the last meal removed deletes the doc.
  saveFood(doc){ const meals=doc.meals||[];
    if(meals.length){ state.food[doc.date]={date:doc.date,meals}; this.write("f-"+doc.date,{date:doc.date,meals,updated:Date.now()}); }
    else { delete state.food[doc.date]; this.write("f-"+doc.date,null); } },
  // Merges a partial change (rest times or seen badges) so neither field drops the other.
  saveSettings(patch){ const s={...state.settings,...patch}; state.settings=s;
    this.write("settings",{rest:s.rest||{}, ...(s.seenBadges?{seenBadges:s.seenBadges}:{}), updated:Date.now()}); },
  async restore(items){
    // items: [{id, data}] ; Firestore batches hold up to 500 writes
    for (let i=0;i<items.length;i+=450){
      const batch=writeBatch(fs);
      items.slice(i,i+450).forEach(it=>batch.set(doc(this.col,it.id), it.data));
      await batch.commit();
    }
  }
};
function signInError(e){
  const c=e&&e.code||"";
  if(c.includes("popup-closed")||c.includes("cancelled")) return "Sign-in cancelled";
  if(c.includes("unauthorized-domain")) return "This website isn't allowed to sign in yet. Add it under Authentication › Settings › Authorized domains in Firebase.";
  if(c.includes("network")) return "No connection. Check your internet and try again.";
  return "Couldn't sign in ("+c+")";
}
async function signIn(){
  const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  try { await signInWithPopup(auth, provider); }
  catch(e){
    if(String(e.code).includes("popup-blocked")||String(e.code).includes("operation-not-supported")) return signInWithRedirect(auth, provider);
    toast(signInError(e));
  }
}
function showAccount(user){
  const el=$("#acct-user"), so=$("#signout");
  el.hidden=so.hidden=!user;
  if(user){ el.textContent=""; const first=(user.displayName||user.email||"").split(" ")[0]; el.textContent=first; }
}
function setSync(t){ $("#sync").textContent=t; }
// Toasts are a popover so they show above open sheets (modal dialogs sit in the top layer).
// Browsers without popover support fall back to a plain hidden/shown element.
const toastPopover=!!HTMLElement.prototype.showPopover;
if(!toastPopover){ const el=$("#toast"); el.removeAttribute("popover"); el.hidden=true; }
let tt; function toast(t){
  const el=$("#toast"); el.textContent=t; clearTimeout(tt);
  if(toastPopover){ try{ if(el.matches(":popover-open")) el.hidePopover(); el.showPopover(); }catch(e){} tt=setTimeout(()=>{ try{ el.hidePopover(); }catch(e){} },2400); }
  else { el.hidden=false; tt=setTimeout(()=>el.hidden=true,2400); }
}

/* ---------- derived ---------- */
const sorted = () => [...state.workouts].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
function exerciseNames(){ const s=new Set(); sorted().forEach(w=>w.entries.forEach(e=>{ if(e.sets.length) s.add(e.ex); })); return [...s]; }
function sessionsFor(ex){ return sorted().map(w=>{ const e=w.entries.find(e=>same(e.ex,ex)); return e&&e.sets.length?{date:w.date,sets:e.sets}:null; }).filter(Boolean); }
function lastBefore(ex,date){ const s=sessionsFor(ex).filter(x=>x.date<date); return s[s.length-1]||null; }
function bestBefore(ex,date){ let b=0; sessionsFor(ex).filter(x=>x.date<date).forEach(x=>x.sets.forEach(s=>b=Math.max(b,e1rm(s.w,s.r)))); return b; }
const workoutFor = date => state.workouts.find(w=>w.date===date);
const dayById = id => state.days.find(d=>d.id===id);
const dayIndex = id => state.days.findIndex(d=>d.id===id);
const WEEK=[6,0,1,2,3,4,5];            // Saturday-first week (JS getDay numbers)
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const weekdayOf = date => new Date(date+"T12:00:00").getDay();
const dayForWeekday = wd => state.days.find(d=>(d.weekdays||[]).includes(wd));
function nextDay(){
  if(!state.days.length) return null;
  const scheduled = dayForWeekday(weekdayOf(state.date)); if (scheduled) return scheduled;
  const done = sorted().filter(w=>w.dayId && dayById(w.dayId) && w.date<state.date && w.entries.some(e=>e.sets.length));
  if(!done.length) return state.days[0];
  const i=dayIndex(done[done.length-1].dayId); return state.days[(i+1)%state.days.length];
}
function lastTrained(dayId){ const w=sorted().filter(w=>w.dayId===dayId && w.entries.some(e=>e.sets.length)); return w.length?w[w.length-1].date:null; }
function suggestionsFor(focus, exclude){
  const ex = exclude.map(x=>x.toLowerCase());
  return (focus||[]).map(m=>({muscle:m, items:LIB[m].filter(n=>!ex.includes(n.toLowerCase()))})).filter(g=>g.items.length);
}

/* ---------- WORKOUT ---------- */
function renderLog(){
  const w = workoutFor(state.date);
  const dateLabel = state.date===today()?"Today":fmtDate(state.date);
  let h = `<div class="row">
    <div class="grow"><div class="label">Workout date</div><h2>${dateLabel}</h2></div>
    <input type="date" id="log-date" value="${state.date}" max="${today()}" style="width:auto">
  </div>`;

  // A day with only cardio still asks which training day it is (the cardio is kept when one is picked).
  const cardioOnly = w && !w.dayId && !w.entries.length && w.dayName==="Cardio";
  if (!w || state.pickDay || cardioOnly){ $("#view-log").innerHTML = h + dayPicker(cardioOnly&&!state.pickDay?null:w) + cardioCard(); fillDatalist(); refreshSheets(); syncWake(); return; }

  const day = dayById(w.dayId), entries = w.entries, M = entries.length;
  const doneN = entries.filter(e=>e.done).length;
  const mins = state.date===today() ? elapsedMin(w, Date.now()) : null;
  h += `<div class="row"><div class="grow"><span class="daytag">${w.dayId&&day?`<span class="num" style="font-size:12px">Day ${dayIndex(w.dayId)+1}</span>`:""}${esc(day?day.name:(w.dayName||"Free workout"))}</span></div>
      <button class="btn ghost small" data-act="change-day">Change day</button></div>`;
  if (M) h += `<div class="stack" style="gap:6px"><span class="label">${doneN} of ${M} done${mins!=null?` · ${mins} min`:""}</span>
      <div class="ebar" role="progressbar" aria-label="Exercises done" aria-valuemin="0" aria-valuemax="${M}" aria-valuenow="${doneN}"><i style="width:${doneN/M*100}%"></i></div></div>`;

  // Focus mode: the exercise the user picked (any order), else the first one not done.
  const picked = entries.findIndex(e=>e.ex===state.openEx);
  const ei = picked>=0 ? picked : nextUnfinished(entries,-1);

function focusCard(w, ei){

      ${editSi>=0
        ? `<button class="btn primary" data-act="save-set" data-ei="${ei}">Save set ${editSi+1}</button><div class="row"><span class="prev grow">Editing set ${editSi+1}</span><button class="btn ghost small" data-act="cancel-edit">Cancel</button></div>`
        : `<button class="btn primary" data-act="add-set" data-ei="${ei}">Add set ${e.sets.length+1}</button>`}
      ${e.sets.length?`<table><thead><tr><th>Set</th><th class="r">kg</th><th class="r">Reps</th><th class="r">e1RM</th><th></th></tr></thead><tbody>${
        e.sets.map((s,si)=>{ const est=e1rm(s.w,s.r); const isPr=est>0&&est>runBest&&best>0; if(est>runBest) runBest=est;
          return `<tr class="setrow${si===editSi?" editing":""}" data-act="edit-set" data-ei="${ei}" data-si="${si}" tabindex="0" aria-label="Edit set ${si+1}"><td class="num">${si+1}</td><td class="r num">${kg(s.w)}</td><td class="r num">${s.r}</td><td class="r num">${est?kg(Math.round(est*10)/10):"–"}${isPr?'<span class="pr">PR</span>':""}</td><td class="r"><button class="btn ghost small" data-act="rm-set" data-ei="${ei}" data-si="${si}" aria-label="Delete set ${si+1}">✕</button></td></tr>`;}).join("")
      }</tbody></table>`:""}

    </div>
    <div class="row">${e.done

      : `<button class="btn secondary grow" data-act="done-ex" data-ei="${ei}">✓ Done</button>`}${
      nx>=0?`<button class="btn secondary grow nextbtn" data-act="next-ex" data-ei="${ei}">Next: ${esc(entries[nx].ex)} ›</button>`:""}</div>`;

function completeCard(w){

  const w = ensureWorkout();

// Keep today's workout in step with edits to its training day:
// new exercises are added, removed ones go if no sets were logged, order follows the day.
function syncTodayWithDay(day){
  const w=workoutFor(today()); if(!w||!day||w.dayId!==day.id) return;
  const nw=clone(w); nw.dayName=day.name;
  const byName=n=>nw.entries.find(e=>same(e.ex,n));
  const planned=day.exercises.map(n=>byName(n)||{ex:n,sets:[]});
  const extras=nw.entries.filter(e=>!day.exercises.some(n=>same(n,e.ex)) && (e.sets.length||e.done));
  const next=planned.concat(extras);
  if (JSON.stringify(next)!==JSON.stringify(nw.entries) || w.dayName!==day.name){ nw.entries=next; store.save(nw); }
}
function editDays(fn, opts){ const days=clone(state.days); fn(days); store.saveDays(days); days.forEach(syncTodayWithDay); if(!(opts&&opts.quiet)) renderDays(); }

/* ---------- PROGRESS ---------- */
function renderProgress(){

  const pts=sess.map(s=>{ let best=0,top=0; s.sets.forEach(x=>{best=Math.max(best,e1rm(x.w,x.r)); top=Math.max(top,x.w);}); return {date:s.date,e1:best,top,sets:s.sets}; });

  <div class="stats">
    <div class="stat"><div class="label">Best e1RM</div><div class="v">${kg(Math.round(allBest*10)/10)} <small>kg</small></div></div>

    [...pts].reverse().map(p=>`<tr><td style="white-space:nowrap">${fmtDate(p.date)}</td><td class="num" style="font-size:13px">${p.sets.map(s=>kg(s.w)+"×"+s.r).join(" · ")}</td><td class="r num">${kg(Math.round(p.e1*10)/10)}${p.e1===allBest?'<span class="pr">PR</span>':""}</td></tr>`).join("")

function chart(pts){
  return lineChart(pts,[{k:"e1",c:"var(--accent)",main:true},{k:"top",c:"var(--muted)",dash:true}],"Estimated 1RM and top set weight over time","One session logged. The chart appears after your second.");
}
function lineChart(all, series, aria, emptyMsg){
  const W=600,H=240,L=44,R=14,T=14,B=30;
  const has=(p,k)=>typeof p[k]==="number"&&isFinite(p[k]);
  const pts=all.filter(p=>series.some(s=>has(p,s.k)));
  if(pts.length<2) return `<div class="empty" style="padding:16px">${emptyMsg}</div>`;
  const vals=pts.flatMap(p=>series.filter(s=>has(p,s.k)).map(s=>p[s.k]));
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.12||Math.max(1,hi*0.05); lo=Math.max(0,lo-pad); hi=hi+pad;
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const t0=+new Date(pts[0].date), t1=+new Date(pts[pts.length-1].date);
  const x=d=>L+((+new Date(d)-t0)/((t1-t0)||1))*(W-L-R);
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g="";
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${kg(Math.round(v*10)/10)}</text>`; }
  const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  idx.forEach((i,k)=>{ const a=k===0?"start":(i===pts.length-1?"end":"middle"); g+=`<text x="${x(pts[i].date)}" y="${H-8}" text-anchor="${a}" font-size="11" fill="var(--muted)">${fmtDateY(pts[i].date)}</text>`; });
  let marks="";
  series.forEach(s=>{
    const sp=pts.filter(p=>has(p,s.k)); if(!sp.length) return;
    const d=sp.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+","+y(p[s.k]).toFixed(1)).join("");
    if(s.main){
      marks+=`<path d="${d}L${x(sp[sp.length-1].date)},${y(lo)}L${x(sp[0].date)},${y(lo)}Z" fill="${s.c}" fill-opacity=".1"/>`;
      marks+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round"/>`;
      marks+=sp.map(p=>`<circle cx="${x(p.date)}" cy="${y(p[s.k])}" r="3" fill="${s.c}"/>`).join("");
      const lp=sp[sp.length-1]; marks+=`<circle cx="${x(lp.date)}" cy="${y(lp[s.k])}" r="6" fill="var(--surface)" stroke="${s.c}" stroke-width="2.5"/>`;
    } else marks+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.5" ${s.dash?'stroke-dasharray="4 4"':""}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}${marks}</svg>`;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

/* ---------- COACH ---------- */
const MUSCLE_OF = {}; Object.entries(LIB).forEach(([m,list])=>list.forEach(n=>{ if(!MUSCLE_OF[n.toLowerCase()]) MUSCLE_OF[n.toLowerCase()]=m; }));
const ACCESSORY_MAP = {"bicep curl":"Biceps","deadlift":"Back","squat":"Quads"};
const muscleOf = n => MUSCLE_OF[n.toLowerCase()] || ACCESSORY_MAP[n.toLowerCase()] || null;
const daysAgo = d => (Date.now()-new Date(d+"T12:00:00"))/864e5;
const r1 = n => Math.round(n*10)/10;

function weeklySets(){
  const counts={}; MUSCLES.forEach(m=>counts[m]=0);
  state.workouts.filter(w=>daysAgo(w.date)<7).forEach(w=>w.entries.forEach(e=>{ const m=muscleOf(e.ex); if(m) counts[m]+=e.sets.length; }));
  return counts;
}
function weightTrend(){
  const s=bodySorted().filter(e=>typeof e.weight==="number" && daysAgo(e.date)<=35);
  if(s.length<2) return null;
  const t0=+new Date(s[0].date), xs=s.map(e=>(+new Date(e.date)-t0)/864e5), ys=s.map(e=>e.weight);
  if(xs[xs.length-1]<7) return null;
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  const perWeek=slope*7; return {perWeek, pct:perWeek/ys[ys.length-1]*100, n:s.length};
}
function insights(){
  const out=[], p=state.profile, goal=p.goal;
  const add=(sec,tone,title,text,chips)=>out.push({sec,tone,title,text,chips});

  // Body weight trend vs goal
  const t=weightTrend();
  if(t){
    const pct=r1(t.pct), wk=r1(t.perWeek);
    const desc=`Over the last few weeks your weight is changing by about <b>${wk>0?"+":""}${wk} kg/week</b> (${pct>0?"+":""}${pct}% of body weight).`;
    if(goal==="fat-loss"){
      if(t.pct>-0.25) add("Body","warn","Fat loss has stalled",desc+" For steady fat loss, aim for 0.5–1% per week. Cut about 200–300 kcal a day or add 2–3k daily steps.");
      else if(t.pct<-1.1) add("Body","warn","You're losing weight quickly",desc+" Faster than about 1% a week makes it harder to keep muscle. Add roughly 200 kcal a day and keep protein high.");
      else add("Body","good","Fat loss is on pace",desc+" That's in the 0.5–1% per week sweet spot. Keep doing what you're doing.");
    } else if(goal==="muscle"){
      if(t.pct<0.1) add("Body","warn","Not gaining enough to build muscle",desc+" A lean bulk works best at about 0.25–0.5% per week. Add roughly 200–250 kcal a day.");
      else if(t.pct>0.6) add("Body","warn","Gaining faster than needed",desc+" Above about 0.5% a week most of the extra is fat. Pull back about 150–200 kcal a day.");
      else add("Body","good","Lean bulk is on pace",desc+" That's a good rate for adding muscle while limiting fat gain.");
    } else if(goal){
      if(Math.abs(t.pct)<=0.3) add("Body","good","Weight is stable",desc+" That fits a "+GOALS[goal].toLowerCase()+" goal.");
      else add("Body","info","Weight is drifting",desc+` For a "${GOALS[goal]}" goal you'd expect roughly stable weight. Check if that's intentional.`);
    }
  } else if(!state.body.some(e=>typeof e.weight==="number")) add("Body","info","Start tracking body weight","Weigh yourself 2–4 times a week, in the morning after the bathroom. After about a week the Coach can tell whether you're on pace for your goal.");

  // InBody composition
  const scans=bodySorted().filter(e=>typeof e.smm==="number"||typeof e.pbf==="number");
  if(scans.length){
    const s=scans[scans.length-1];
    if(typeof s.pbf==="number" && p.sex){
      const [lo,hi]=p.sex==="male"?[10,20]:[18,28];
      if(s.pbf>hi) add("Body","info",`Body fat ${s.pbf}% is above the typical ${lo}–${hi}% range`,`Your latest scan (${fmtDate(s.date)}) puts you above the usual range for ${p.sex==="male"?"men":"women"}. A modest calorie deficit with heavy lifting and high protein brings this down while keeping muscle.`);
      else if(s.pbf<lo) add("Body","info",`Body fat ${s.pbf}% is below the typical ${lo}–${hi}% range`,"Very lean. If energy, sleep or strength are dropping, eat closer to maintenance.");
      else add("Body","good",`Body fat ${s.pbf}% is in the typical ${lo}–${hi}% range`,`Based on your scan from ${fmtDate(s.date)}.`);
    }
    if(typeof s.vfl==="number" && s.vfl>=10) add("Body","warn",`Visceral fat level ${s.vfl} is elevated`,"InBody flags 10 or higher. Regular cardio (about 150 minutes a week), a small calorie deficit and fewer sugary drinks help most. Worth mentioning to a doctor at your next check-up.");
    const prev=scans.slice(0,-1).reverse().find(e=>typeof e.smm==="number"&&typeof e.bfm==="number");
    if(prev && typeof s.smm==="number" && typeof s.bfm==="number"){
      const dm=r1(s.smm-prev.smm), df=r1(s.bfm-prev.bfm);
      const txt=`Since your scan on ${fmtDate(prev.date)}: muscle <b>${dm>0?"+":""}${dm} kg</b>, fat <b>${df>0?"+":""}${df} kg</b>.`;
      if(dm>=0 && df<0) add("Body","good","Recomposition is working",txt+" You're losing fat while keeping or adding muscle.");
      else if(dm<-0.4) add("Body","warn","You lost some muscle",txt+" Keep lifting heavy, hit your protein target every day, and avoid cutting calories too fast.");
      else if(dm>0 && df>dm) add("Body","info","Gaining more fat than muscle",txt+" Trim the surplus a little and make sure training volume is progressing.");
      else add("Body","info","Scan comparison",txt);
    }
  }
  // Waist to height
  const wa=latestWith("waist");
  if(wa && p.height){ const r=wa.waist/p.height;
    add("Body", r<0.5?"good":"info", `Waist-to-height ratio ${r.toFixed(2)}`, r<0.5?"Under 0.5, the commonly used healthy cut-off.":"0.5 or above. Bringing the waist down usually tracks with less visceral fat, so it's a good number to watch alongside the scale."); }

  // Calories and protein targets live on the Today card (energy.js), not here.

  // Training volume per muscle
  const wk=state.workouts.filter(w=>daysAgo(w.date)<7&&trainedOn(w));
  if(state.workouts.some(trainedOn)){
    const sets=weeklySets();
    const lows=MUSCLES.filter(m=>m!=="Core"&&m!=="Calves"&&sets[m]<6).sort((a,b)=>sets[a]-sets[b]).slice(0,3);
    if(wk.length<2) add("Training","warn",`${wk.length} workout${wk.length===1?"":"s"} in the last 7 days`,"Training each muscle about twice a week gives the best results for most people. Aim for 3–4 sessions a week.");
    else add("Training","good",`${wk.length} workouts in the last 7 days`,"Good consistency.");
    if(lows.length) add("Training","warn","Under-trained muscle groups",`These got fewer than 6 hard sets this week: <b>${lows.join(", ")}</b>. About 10–20 sets per muscle per week works best for growth.`,
      lows.flatMap(m=>LIB[m].slice(0,2)));
  }

  // Lift progress
  const stalls=[], wins=[];
  exerciseNames().forEach(ex=>{
    const s=sessionsFor(ex).map(x=>({date:x.date,b:Math.max(...x.sets.map(z=>e1rm(z.w,z.r)))}));
    if(s.length<4) return;
    const before=Math.max(...s.slice(0,-3).map(x=>x.b)), recent=Math.max(...s.slice(-3).map(x=>x.b));
    if(recent<=before*1.005) stalls.push(ex); else if(s[s.length-1].b>=recent) wins.push(ex);
  });
  if(stalls.length) add("Training","warn",`Stalled: ${stalls.slice(0,3).join(", ")}`,"No new best in the last 3 sessions. Try dropping the weight about 10% and building back up, switching rep range (for example from 5s to 8s), or adding a set. Sleep and calories matter too.");
  if(wins.length) add("Training","good",`Progressing: ${wins.slice(0,3).join(", ")}`,"New bests recently. Keep adding small amounts of weight or reps each week.");
  return out;
}

function balanceGood(goal,bal){

  if(goal==="fat-loss"||goal==="recomp") return bal<0;
  if(goal==="muscle"||goal==="strength") return bal>0;
  if(goal==="maintain") return Math.abs(bal)<=200;
  return false;
}

const signedTxt=v=>v==null?"–":(v>0?"+":v<0?"−":"")+Math.abs(Math.round(v)).toLocaleString("en-US");

function reviewPrompt(){

    setsPerMuscleLast7Days:weeklySets(),

  const prompt=`You are an experienced strength and nutrition coach. Review this person's gym log and body data and give a short, personal review.

Rules:

${JSON.stringify(summary)}`;

async function copyReview(){

// Everything here is derived from logged data (achievements.js); only seenBadges is stored.
function goalsInput(){ return {workouts:state.workouts, body:state.body, food:state.food, days:state.days, profile:state.profile, today:today()}; }
const RATIO_BADGE={"bench-bw":"Bench Press","squat-1.5":"Squat","deadlift-2":"Deadlift"};
function badgeProgress(b){
  if(b.earned) return "Earned "+fmtDate(b.earned);
  const n=v=>Math.floor(v).toLocaleString("en-US"), id=b.id;
  if(RATIO_BADGE[id]) return b.value?`Best ${b.value.toFixed(2)}× of ${b.target}×`:`Log a ${RATIO_BADGE[id]} set and your weight`;
  if(id.startsWith("volume")) return `${n(b.value/1000)} / ${n(b.target/1000)} t`;
  if(id==="goal-first-kg") return `${Math.max(0,b.value).toFixed(1)} / 1 kg`;
  if(id==="goal-reached") return "Reach your target weight";
  if(id.startsWith("streak")) return `${b.value} / ${b.target} weeks`;
  if(id.startsWith("food")) return `${b.value} / ${b.target} days`;
  if(id.startsWith("kcal")) return `${n(b.value)} / ${n(b.target)} kcal`;
  if(id.startsWith("cardio")) return `${n(b.value)} / ${n(b.target)} min`;
  return `${n(b.value)} / ${n(b.target)}`;
}
function renderGoals(){
  const input=goalsInput(), list=badges(input), xp=xpSummary(input,list), g=goalProgress(input);
  const ts=trainingStreak(state.workouts,state.days,today()), fdays=foodStreak(state.food,today());
  const signed=v=>(v>0?"+":v<0?"−":"")+Math.abs(Math.round(v)).toLocaleString("en-US");
  let goal;
  if(!g) goal=`<p class="prev" style="margin:0">Set a target weight to track your progress.</p><div class="row"><button class="btn primary small" data-act="set-goal">Set a target weight</button></div>`;
  else if(g.hold) goal=`<p style="margin:0">Your target is your current weight: hold within ±1 kg.</p>`;
  else if(g.needsStartWeight) goal=`<p style="margin:0">Log your weight to start tracking this goal.</p>`;
  else goal=`<div class="gbar"><div class="row label"><span class="grow">Calorie bank</span><span class="num">${signed(g.bank)} / ${signed(g.target)} kcal</span></div><div class="ebar"><i style="width:${g.bankPct*100}%"></i></div></div>
    <div class="gbar"><div class="row label"><span class="grow">Weight</span><span class="num">${kg(g.start)} → ${kg(g.goalWeight)} kg · ${Math.round(g.weightPct*100)}%</span></div><div class="ebar"><i style="width:${g.weightPct*100}%"></i></div></div>
    <p class="prev" style="margin:0">Based on ${g.loggedDays} of ${g.totalDays} days with meals logged.</p>
    <p style="margin:0">${g.bankReached?"Calorie target reached. Keep logging until the scale catches up.":g.finish?`Estimated finish: <b>${esc(fmtDateY(g.finish))}</b>`:g.awayFromGoal?"At this pace you're moving away from your goal.":"Log meals for a few days to estimate a finish date."}</p>`;
  const dots=Array.from({length:ts.target},(_,i)=>i<ts.thisWeek?"●":"○").join("");
  const earned=list.filter(b=>b.earned).sort((a,b)=>a.earned<b.earned?1:a.earned>b.earned?-1:0), locked=list.filter(b=>!b.earned);
  const tile=b=>`<div class="ach ${b.earned?"on":""}"><span class="medal" aria-hidden="true"></span><span class="bname">${esc(b.name)}</span><span class="prev bsub">${esc(badgeProgress(b))}</span></div>`;
  $("#view-goals").innerHTML=`<h2>Goals</h2>
    <div class="card"><div class="row"><h3 class="grow">Level ${xp.level} · ${xp.title}</h3><span class="num prev">${xp.xp.toLocaleString("en-US")} XP</span></div>
      <div class="ebar" role="progressbar" aria-label="XP to next level" aria-valuemin="0" aria-valuemax="${xp.needed}" aria-valuenow="${xp.into}"><i style="width:${xp.into/xp.needed*100}%"></i></div>
      <p class="prev" style="margin:0">${xp.into.toLocaleString("en-US")} / ${xp.needed.toLocaleString("en-US")} XP to level ${xp.level+1} · +${xp.weekXp.toLocaleString("en-US")} XP this week</p></div>
    <div class="card"><h3>Target weight</h3>${goal}</div>
    <div class="card"><h3>Streaks</h3>
      <div class="row"><span class="grow">Training: <b>${ts.weeks} week${ts.weeks===1?"":"s"}</b></span><span class="dots" role="img" aria-label="${ts.thisWeek} of ${ts.target} this week">${dots}</span><span class="prev">${ts.thisWeek} of ${ts.target} this week</span></div>
      <div class="row"><span class="grow">Food log: <b>${fdays} day${fdays===1?"":"s"}</b></span></div></div>
    <div class="card"><h3>Badges · ${earned.length} of ${list.length}</h3><div class="achs">${earned.map(tile).join("")}${locked.map(tile).join("")}</div></div>`;
}
// New badges toast once (across devices). Runs only on server-confirmed data, so an empty offline
// cache on a new device can't overwrite the saved list. First run marks existing badges silently.
let badgeRev=null;
function checkBadges(){
  if(!state.authed||!state.serverSynced) return;
  if(badgeRev===state.dataRev) return;  // nothing changed since the last check
  badgeRev=state.dataRev;
  const earned=badges(goalsInput()).filter(b=>b.earned), seen=state.settings.seenBadges;
  if(seen===undefined){ store.saveSettings({seenBadges:earned.map(b=>b.id)}); return; }
  const fresh=earned.filter(b=>!seen.includes(b.id));
  if(!fresh.length) return;
  store.saveSettings({seenBadges:[...seen,...fresh.map(b=>b.id)]});
  fresh.forEach((b,i)=>setTimeout(()=>toast("Badge earned: "+b.name),i*2600));
}

function renderHistory(){
  const ws=sorted().filter(trainedOn).reverse();
  let h=`<h2>History</h2>`;
  if(!ws.length){ $("#view-history").innerHTML=h+`<div class="empty"><strong>No workouts yet</strong>Every day you log shows up here. Tap one to open and edit it.</div>`+backupCard(); return; }
  const week=ws.filter(w=>(Date.now()-new Date(w.date+"T12:00:00"))/864e5<7).length;
  h+=`<div class="row label" style="gap:16px"><span>${ws.length} workouts logged</span><span>${week} in the last 7 days</span></div><div class="stack">`;
  ws.forEach(w=>{
    const done=w.entries.filter(e=>e.sets.length);
    const v=done.reduce((a,e)=>a+vol(e.sets),0), sets=done.reduce((a,e)=>a+e.sets.length,0);
    const day=dayById(w.dayId), dname=day?day.name:(w.dayName||"Free workout");
    h+=`<div class="card" data-open="${esc(w.date)}" tabindex="0" style="cursor:pointer">
      <div class="ex-head"><div class="stack" style="gap:6px;min-width:0"><span class="prev">${fmtDateY(w.date)}</span><span class="daytag" style="align-self:flex-start">${esc(dname)}</span></div><span class="num prev" style="white-space:nowrap">${historySummary(w,sets,v)}</span></div>
      <div class="chips">${done.map(e=>`<span class="chip">${esc(e.ex)} · ${e.sets.length}</span>`).join("")}${(w.cardio||[]).map(c=>`<span class="chip">${CARDIO_LABEL[c.type]||"Cardio"} ${c.min} min</span>`).join("")}</div>
      <div class="row" style="justify-content:flex-end">${state.confirmDel===w.id
        ?`<span class="prev">Delete this workout?</span><button class="btn small" data-act="cancel-del">Keep</button><button class="btn small danger" data-act="del-w" data-id="${w.id}">Delete</button>`
        :`<button class="btn ghost small danger" data-act="ask-del" data-id="${w.id}">Delete</button>`}</div></div>`;
  });
  $("#view-history").innerHTML=h+"</div>"+backupCard();
}
function historySummary(w,sets,v){
  const parts=[]; if(sets) parts.push(`${sets} sets · ${kg(v)} kg`);
  const ek=exerciseKcal(w,weightOn(state.body,w.date)).total; if(ek) parts.push(`${ek.toLocaleString("en-US")} kcal exercise`);
  return parts.join(" · ");
}
function backupCard(){
  let last=null; try{ last=localStorage.getItem("ironlog.lastBackup"); }catch(e){}
  const age=last?Math.floor(daysAgo(last)):null;
  const status = last==null ? `<span class="prev" style="color:var(--danger)">No backup downloaded on this device yet.</span>`
    : age>=30 ? `<span class="prev" style="color:var(--danger)">Last backup ${age} days ago. Time for a new one.</span>`
    : `<span class="prev" style="color:var(--good)">Last backup ${age===0?"today":age+" day"+(age>1?"s":"")+" ago"}.</span>`;
  return `<div class="card"><h3>Backup</h3>
    <p class="prev" style="margin:0">Download everything (workouts, days, body data) as a file you keep, for example in Google Drive. Restore it here any time, even into a new account. Once a month is a good habit.</p>
    ${status}
    <div class="row"><button class="btn" data-act="export">Download backup</button>
    <label class="btn" for="restore-file" style="cursor:pointer">Restore from file</label><input type="file" id="restore-file" accept=".json,application/json" hidden></div></div>`;
}
function exportData(){
  const items=[
    ...state.workouts.map(w=>{ const {id,...data}=w; return {id,data}; }),
    ...state.body.map(b=>({id:"b-"+b.date,data:b})),
    {id:"program",data:{days:state.days,v:PROGRAM_VERSION,updated:Date.now()}},
    {id:"profile",data:state.profile},
    {id:"settings",data:{rest:state.settings.rest, ...(state.settings.seenBadges?{seenBadges:state.settings.seenBadges}:{}), updated:Date.now()}},
    ...Object.values(state.food).map(fd=>({id:"f-"+fd.date,data:{date:fd.date,meals:fd.meals,updated:Date.now()}}))
  ];
  const blob=new Blob([JSON.stringify({app:"iron-log",version:1,exported:new Date().toISOString(),items},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="iron-log-backup-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  try{ localStorage.setItem("ironlog.lastBackup",today()); }catch(e){}
  setTimeout(()=>{ if(state.view==="history") renderHistory(); },300);
}
async function importData(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=="iron-log"||!Array.isArray(j.items)) throw new Error("format");
    // Backup files can come from anywhere: clean every item, skip anything that looks wrong.
    const {items, skipped}=cleanBackupItems(j.items,{bodyKeys:Object.keys(BF), goals:Object.keys(GOALS), muscles:MUSCLES});
    if(!items.length) throw new Error("format");
    await store.restore(items); toast("Restored "+items.length+" items"+(skipped?`, skipped ${skipped} that looked damaged`:""));
  }catch(e){ console.error(e); toast(e.message==="format"?"That file isn't an Iron Log backup":"Couldn't restore that file"); }
}

// Bottom sheet with drawings, muscles and tips. Drawings are inlined (not <img>) so the
// app's CSS colors apply. exInfoToken drops late fetches from a previously opened exercise.
let exInfoToken=0;
function openExInfo(name){
  const info=infoFor(name); if(!info) return;
  const dlg=$("#exinfo"), token=++exInfoToken;
  const figs = info.img ? `<div class="ex-figs">${[["start","Start"],["end","Finish"]].map(([p,l])=>
      `<figure><div class="ex-fig" data-src="/exercises/${info.slug}-${p}.svg" aria-hidden="true"></div><figcaption class="label">${l}</figcaption></figure>`).join("")}</div>` : "";
  dlg.innerHTML = `<div class="sheet-head"><h2 id="exinfo-title">${esc(info.name)}</h2><button class="btn ghost small" data-act="exinfo-close" aria-label="Close">✕</button></div>
    ${figs}
    <p class="ex-works">Works: <b>${info.primary.map(esc).join(", ")}</b>${info.secondary.length?` <span class="prev">· ${info.secondary.map(esc).join(", ")}</span>`:""}</p>
    <ul class="ex-tips">${info.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    ${info.img?`<p class="prev ex-credit">Illustrations: Everkinetic, CC BY-SA 4.0</p>`:""}`;
  if(!dlg.open){ dlg.showModal(); history.pushState({exinfo:1},""); }
  dlg.querySelectorAll(".ex-fig").forEach(box=>{
    fetch(box.dataset.src).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(svg=>{ if(token===exInfoToken) box.innerHTML=svg; })
      .catch(()=>{ if(token===exInfoToken) box.innerHTML=`<span class="prev">Drawing not available offline yet</span>`; });
  });
}
function closeExInfo(){ const d=$("#exinfo"); if(d.open) d.close(); }
// Every way of closing (✕, backdrop, Esc, back gesture) ends in the dialog's "close" event.
// Opening pushed a history entry so the phone's back gesture closes the sheet; remove it here.
$("#exinfo").addEventListener("close",()=>{ exInfoToken++; if(history.state&&history.state.exinfo) history.back(); });
$("#exinfo").addEventListener("click",e=>{
  if(e.target!==e.currentTarget) return;
  const r=e.currentTarget.getBoundingClientRect();
  if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right) closeExInfo(); // tap on the backdrop
});
window.addEventListener("popstate",()=>{ if(!(history.state&&history.state.exinfo)) closeExInfo(); });
const SCREEN_TITLES={log:"Workout",coach:"Coach",body:"Body",goals:"Goals",days:"Days",progress:"Lifts",history:"History"};

$("#moresheet").addEventListener("click",e=>{

/* ---------- REST TIMER ---------- */
// state.rest = {ex, endsAt, total}. Time left is always computed from endsAt, so it stays right
// after the browser throttles a background tab. Mirrored to localStorage to survive a reload.
let restTick=null, restAlerted=false, restSaveTimer=null, audioCtx=null;
function persistRest(){ try{ if(state.rest) localStorage.setItem("ironlog.rest",JSON.stringify(state.rest)); else localStorage.removeItem("ironlog.rest"); }catch(e){} }
// Browsers only allow sound after a tap, so the audio context is created/resumed on "Add set".
function unlockAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  try{ if(!audioCtx) return;
    const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.27);
  }catch(e){}
}
function restAlert(){ try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} beep(); }
function drawRest(){
  const ph=restPhase(state.rest,Date.now());
  if(ph==="none"||ph==="expired"){ clearRest(); return; }
  const bar=$("#restbar");
  bar.hidden=false; document.body.classList.add("has-restbar"); bar.classList.toggle("go",ph==="go");
  $("#rb-label").textContent=(ph==="go"?"Rest over · ":"Rest · ")+state.rest.ex;
  $("#rb-clock").textContent=ph==="go"?"Go":fmtClock(remaining(state.rest.endsAt,Date.now()));
  if(ph==="go"&&!restAlerted){ restAlerted=true; restAlert(); }
}
function runRest(){ clearInterval(restTick); restTick=setInterval(drawRest,250); drawRest(); }
function startRestFor(ex){ unlockAudio(); state.rest=startRest(ex,restFor(ex,state.settings),Date.now()); restAlerted=false; persistRest(); runRest(); }
function clearRest(){ state.rest=null; restAlerted=false; persistRest(); clearInterval(restTick); restTick=null; $("#restbar").hidden=true; document.body.classList.remove("has-restbar"); }
function adjustRestBy(d){
  if(!state.rest) return;
  const now=Date.now(); let r=state.rest;
  if(restPhase(r,now)!=="resting") r=startRest(r.ex,r.total,now); // rest already over: start again from now
  state.rest=adjustRest(r,d,now); restAlerted=false; persistRest(); drawRest();
  const ex=state.rest.ex, total=state.rest.total;
  // Several quick taps = one write.
  clearTimeout(restSaveTimer); restSaveTimer=setTimeout(()=>store.saveSettings({rest:{...state.settings.rest,[ex]:total}}),1500);
}
function resumeRest(){
  let r=null; try{ r=JSON.parse(localStorage.getItem("ironlog.rest")||"null"); }catch(e){}
  const ph=restPhase(r,Date.now());
  if(ph==="resting"||ph==="go"){ state.rest=r; restAlerted=ph==="go"; runRest(); } else clearRest();
}

/* ---------- THEME ---------- */
// "system" follows the phone; light/dark override it. The <head> script applies it before first paint.
function currentTheme(){ try{ const t=localStorage.getItem("ironlog.theme"); return t==="light"||t==="dark"?t:"system"; }catch(e){ return "system"; } }
function applyTheme(setting){
  try{ localStorage.setItem("ironlog.theme",setting); }catch(e){}
  const a=themeAttr(setting);
  if(a) document.documentElement.dataset.theme=a; else delete document.documentElement.dataset.theme;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content=getComputedStyle(document.documentElement).getPropertyValue("--surface").trim()||"#ffffff";
}

/* ---------- LANGUAGE ---------- */
// English / Arabic. Plain labels are swapped by trDom (also for everything drawn later, via the observer below);
// text with numbers or names goes through t()/tn() while drawing. The <head> script sets lang/dir before first paint.
function currentLang(){ try{ return detectLang(localStorage.getItem("ironlog.lang"),navigator.language); }catch(e){ return "en"; } }
function applyLang(code,quiet){
  if(!setLang(code)) return;
  try{ localStorage.setItem("ironlog.lang",code); }catch(e){}
  const de=document.documentElement; de.lang=code; de.dir=isRtl()?"rtl":"ltr";
  trDom(document.body);
  document.querySelectorAll("[data-act=lang-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===code));
  if(!quiet&&state.authed){ renderSoon(); refreshSheets(); }
}
// Content drawn after a language change (innerHTML in views and sheets) is translated as it is added.
new MutationObserver(ms=>{ if(isRtl()) for(const m of ms) m.addedNodes.forEach(n=>trDom(n)); }).observe(document.body,{childList:true,subtree:true});

function render(){
  const authed=state.authed;
  $("#nav").hidden=!authed; $("#view-signin").hidden=authed;
  if(!authed){ VIEWS.forEach(v=>$("#view-"+v).hidden=true); renderSignin(); syncWake(); return; }
  const inMore=["days","progress","history"].includes(state.view);
  document.querySelectorAll(".tabbar button").forEach(b=>{ if(b.dataset.view===state.view||(inMore&&b.dataset.view==="more")) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#screen-title").textContent=SCREEN_TITLES[state.view]||"Iron Log";
  VIEWS.forEach(v=>$("#view-"+v).hidden=v!==state.view);
  ({log:renderLog,days:renderDays,body:renderBody,coach:renderCoach,goals:renderGoals,progress:renderProgress,history:renderHistory})[state.view]();
  syncWake();
}
function go(view){ state.view=view; try{localStorage.setItem("ironlog.view",view);}catch(e){} render(); window.scrollTo(0,0); }

let renameTimer=null;
document.addEventListener("input",e=>{
  const r=e.target; if(r.dataset&&r.dataset.actChange==="rename"){ clearTimeout(renameTimer); renameTimer=setTimeout(()=>{ const v=r.value.trim(); if(v&&dayById(r.dataset.id)&&dayById(r.dataset.id).name!==v) editDays(ds=>{ ds.find(d=>d.id===r.dataset.id).name=v; },{quiet:true}); },700); } const t=e.target; if(t.id==="meal-kcal") state.mealDraft.kcal=t.value; if(t.id==="meal-protein") state.mealDraft.protein=t.value; if(t.id==="meal-name") state.mealDraft.name=t.value; if(t.id==="cardio-min") state.cardioDraft.min=t.value; if(t.id==="cardio-kcal") state.cardioDraft.kcal=t.value; if(t.dataset.f&&t.dataset.ex!=null){ (ui[t.dataset.ex]||={w:"",r:""})[t.dataset.f]=t.value; } });
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="log-date"&&t.value){ stopEditing(); state.date=t.value; state.pickDay=false; state.openEx=undefined; renderLog(); }
  if(t.id==="prog-ex"){ state.progressEx=t.value; renderProgress(); }
  if(t.id==="body-date"&&t.value){ state.bdate=t.value; renderBody(); }
  if(t.id==="restore-file"&&t.files&&t.files[0]){ importData(t.files[0]); t.value=""; }
  if(t.id==="coach-date"&&t.value){ state.cdate=t.value; renderCoach(); }
  if(t.id==="body-metric"){ state.metric=t.value; renderBody(); }
  if(t.dataset.actChange==="rename"){ clearTimeout(renameTimer); const v=t.value.trim(); if(!v||dayById(t.dataset.id)?.name===v) return; editDays(ds=>{ ds.find(d=>d.id===t.dataset.id).name=v; },{quiet:true}); }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="meal-form"){
    const kRaw=$("#meal-kcal").value.trim(), pRaw=$("#meal-protein").value.trim().replace(",","."), name=$("#meal-name").value.trim();
    const k=Number(kRaw), p=pRaw===""?null:Number(pRaw);
    if(!(Number.isInteger(k)&&k>=1&&k<=5000) || (p!==null&&!(Number.isFinite(p)&&p>=0&&p<=500)) || name.length>40){ toast("Enter 1–5000 kcal (protein 0–500 g)"); return; }
    const d=state.cdate, meals=[...((state.food[d]&&state.food[d].meals)||[]), {id:uid(), name:name||null, kcal:k, protein:p}];
    store.saveFood({date:d, meals}); state.mealDraft={kcal:"",protein:"",name:""}; renderCoach(); toast("Meal added"); return;
  }
  if(f.id==="quickw-form"){
    const n=parseFloat(String($("#quickw").value).trim().replace(",","."));
    if(!(isFinite(n)&&n>0)){ toast("Body weight needs a number"); return; }
    store.saveBody({...withWeight(state.body.find(e=>e.date===state.bdate),state.bdate,n), updated:Date.now()});
    renderBody(); toast("Saved for "+fmtDate(state.bdate)); return;
  }
  if(f.id==="add-ex-form"){ addExerciseToWorkout($("#new-ex").value); }
  if(f.id==="profile-form"){
    const fd=new FormData(f), num=v=>{ const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; };
    const p={sex:fd.get("sex")||null, height:num(fd.get("height")), birthYear:num(fd.get("birthYear")), goal:fd.get("goal")||null};
    // Target weight is optional; changing it restarts the goal from today.
    const gw=String(fd.get("goalWeight")||"").trim()===""?null:num(fd.get("goalWeight"));
    if(String(fd.get("goalWeight")||"").trim()!==""&&!(gw>=30&&gw<=300)){ toast("Target weight must be 30–300 kg"); return; }
    p.goalWeight=gw; p.goalStart=gw==null?null:(gw===state.profile.goalWeight&&state.profile.goalStart?state.profile.goalStart:today());
    const yr=new Date().getFullYear();
    if(!p.sex||!p.goal||!p.height||p.height<100||p.height>250||!p.birthYear||p.birthYear<yr-100||p.birthYear>yr-10){ toast("Fill in all four fields: height in cm (100–250) and a 4-digit birth year"); return; }
    store.saveProfile(p); state.editProfile=false; renderBody(); toast("Saved");
  }
  if(f.id==="body-form"){
    const e={date:state.bdate}; let any=false, bad=null;
    Object.keys(BF).forEach(k=>{ const raw=String(f.elements[k]?.value||"").trim().replace(",","."); if(!raw) return; const n=parseFloat(raw); if(!isFinite(n)||n<0){ bad=BF[k].label; return; } e[k]=n; any=true; });
    if(bad){ toast(bad+" needs a number"); return; }
    if(!any){ toast("Enter at least one value, like your body weight"); return; }
    e.updated=Date.now(); store.saveBody(e); renderBody(); toast("Entry saved for "+fmtDate(state.bdate));
  }
  if(f.dataset.form==="add-dex"){ const v=f.querySelector("input").value.trim(); if(!v) return; const n=canonical(v);
    const d=dayById(f.dataset.id); if(d.exercises.some(x=>same(x,n))){ toast(n+" is already on this day"); return; }
    editDays(ds=>ds.find(x=>x.id===f.dataset.id).exercises.push(n)); setTimeout(()=>document.querySelector(`[data-form="add-dex"] input`)?.focus(),0); }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b){
    const c=e.target.closest("[data-open]"); if(c){ state.date=c.dataset.open; state.pickDay=false; state.openEx=undefined; go("log"); return; }
    const r=e.target.closest("[data-bdate]"); if(r){ state.bdate=r.dataset.bdate; renderBody(); window.scrollTo(0,0); }
    return;
  }
  e.stopPropagation();
  const a=b.dataset.act, ei=+b.dataset.ei, id=b.dataset.id;
  switch(a){
    case "step":{ const inp=document.getElementById(b.dataset.f+"-"+ei); let v=Math.max(0,(parseFloat(inp.value)||0)+parseFloat(b.dataset.d)); inp.value=b.dataset.f==="r"?Math.round(v):kg(v); inp.dispatchEvent(new Event("input",{bubbles:true})); break; }
    case "edit-set":{ const en=ensureWorkout().entries[ei], si=+b.dataset.si, s=en.sets[si];
      state.editSet={date:state.date,ex:en.ex,si}; ui[en.ex]={w:kg(s.w),r:String(s.r)}; renderLog(); break; }
    case "cancel-edit": stopEditing(); renderLog(); break;
    case "save-set":{
      const w=ensureWorkout(), en=w.entries[ei], v=readSet(ei), si=editIndexFor(state.editSet, state.date, en.ex, en.sets);
      if(!v||si<0) return;
      en.sets[si]=en.sets[si].t?{w:v.w,r:v.r,t:en.sets[si].t}:{w:v.w,r:v.r}; stopEditing(); store.save(w); renderLog(); break; }
    case "add-set":{
      const w=ensureWorkout(), en=w.entries[ei], v=readSet(ei);
      if(!v) return;
      const wt=v.w, r=v.r;
      en.sets.push({w:wt,r,t:Date.now()}); delete ui[en.ex]; store.save(w); renderLog(); startRestFor(en.ex);
      const best=bestBefore(en.ex,state.date);
      if(best>0&&e1rm(wt,r)>best&&en.sets.filter(s=>e1rm(s.w,s.r)>best).length===1) toast("New PR on "+en.ex+"!");
      break; }
    case "rest-adj": adjustRestBy(+b.dataset.d); break;
    case "rest-skip": clearRest(); break;
    case "ex-info": openExInfo(b.dataset.name); break;
    case "tab": go(b.dataset.view); break;
    case "tips-all": state.coachAllTips=!state.coachAllTips; renderCoach(); break;
    case "coach-more": state.coachMore=!state.coachMore; renderCoach(); break;
    case "body-full": state.bodyFull=true; renderBody(); break;
    case "jump-ex": stopEditing(); state.openEx=b.dataset.name; renderLog(); break;
    case "next-ex":{ const w=workoutFor(state.date); const nx=w?nextUnfinished(w.entries,ei):-1; if(nx>=0){ stopEditing(); state.openEx=w.entries[nx].ex; renderLog(); scrollToOpen(); } break; }
    case "open-exsheet": openSheet("#exsheet"); break;
    case "open-cardiosheet": openSheet("#cardiosheet"); break;
    case "sheet-close": closeSheet("#exsheet"); closeSheet("#cardiosheet"); break;
    case "more-open": openMore(); break;
    case "more-close": closeMore(); break;
    case "more-go": closeMore(); go(b.dataset.view); break;
    case "theme-set": applyTheme(b.dataset.v); openMore(); break;
    case "lang-set": applyLang(b.dataset.v); openMore(); break;
    case "set-goal": state.editProfile=true; go("body"); setTimeout(()=>document.getElementById("pf-goalw")?.focus(),0); break;
    case "meal-name": $("#meal-name").value=state.mealDraft.name=b.dataset.name; break;
    case "rm-meal":{ const d=state.cdate; store.saveFood({date:d, meals:((state.food[d]&&state.food[d].meals)||[]).filter(m=>m.id!==b.dataset.id)}); renderCoach(); break; }
    case "cardio-type": state.cardioDraft.type=b.dataset.v; renderLog(); break;
    case "cardio-int": state.cardioDraft.intensity=b.dataset.v; renderLog(); break;
    case "cardio-step":{ const d=state.cardioDraft; d.min=String(Math.max(1,Math.min(600,(parseInt(d.min,10)||0)+(+b.dataset.d)))); renderLog(); break; }
    case "add-cardio":{
      const d=state.cardioDraft, mRaw=String(d.min).trim(), kRaw=String(d.kcal).trim(), m=Number(mRaw), k=kRaw===""?null:Number(kRaw);
      if(!(Number.isInteger(m)&&m>=1&&m<=600) || (k!==null&&!(Number.isInteger(k)&&k>=1&&k<=5000))){ toast("Enter 1–600 minutes and, if you have it, 1–5000 kcal"); return; }
      const w=ensureWorkout(); if(!workoutFor(state.date)&&!w.dayName) w.dayName="Cardio";
      w.cardio=[...(w.cardio||[]),{id:uid(),type:d.type,min:m,intensity:d.intensity,kcal:k}];

    case "rm-cardio":{ const w=ensureWorkout(); w.cardio=(w.cardio||[]).filter(c=>c.id!==b.dataset.id); store.save(w); renderLog(); break; }
    case "exinfo-close": closeExInfo(); break;
    case "rm-set":{ const w=ensureWorkout(), en=w.entries[ei], si=+b.dataset.si;
      // Deleting the edited set or one before it would shift indexes, so leave edit mode.
      if(state.editSet&&state.editSet.ex===en.ex&&si<=state.editSet.si) stopEditing();
      en.sets.splice(si,1); store.save(w); renderLog(); break; }
    case "rm-ex":{ const w=ensureWorkout(); w.entries.splice(ei,1); state.openEx=undefined; stopEditing(); store.save(w); renderLog(); break; }

    case "ask-ddel": state.confirmDayDel=id; renderDays(); break;
    case "cancel-ddel": state.confirmDayDel=null; renderDays(); break;
    case "del-day": state.confirmDayDel=null; state.editDay=null; editDays(ds=>ds.splice(ds.findIndex(x=>x.id===id),1)); break;
    case "ask-reset": state.confirmReset=true; renderDays(); break;
    case "cancel-reset": state.confirmReset=false; renderDays(); break;
    case "do-reset": state.confirmReset=false; state.pickSplit=false; state.editDay=null; store.saveDays([]); renderDays(); break;
    case "edit-profile": state.editProfile=true; renderBody(); break;
    case "cancel-profile": state.editProfile=false; renderBody(); break;
    case "del-body": store.removeBody(state.bdate); renderBody(); toast("Entry deleted"); break;
    case "goto-body": go("body"); break;
    case "coach-add":{ const keep=state.view; state.date=today(); addExerciseToWorkout(b.dataset.name); state.view=keep; toast(b.dataset.name+" added to today's workout"); renderCoach(); break; }
    case "copy-review": copyReview(); break;
    case "signin": signIn(); break;
    case "export": exportData(); break;
    case "ask-del": state.confirmDel=id; renderHistory(); break;
    case "cancel-del": state.confirmDel=null; renderHistory(); break;
    case "del-w": store.remove(id); state.confirmDel=null; renderHistory(); toast("Workout deleted"); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches?.("tr[data-act]")){ e.target.click(); return; } if(e.key==="Enter"){ const c=e.target.closest?.("[data-open]"); if(c&&e.target===c){ state.date=c.dataset.open; go("log"); } } });

try{ const v=localStorage.getItem("ironlog.view"); if(VIEWS.includes(v)) state.view=v; }catch(e){}
$("#signout").addEventListener("click",()=>{ clearRest(); closeMore(); signOut(auth); });
// Sheets add history entries; restoring the old scroll position when they close would undo
// go()'s scroll-to-top (e.g. More → Lifts opening halfway down), so the app handles scrolling itself.
try{ history.scrollRestoration="manual"; }catch(e){}
window.addEventListener("offline",()=>setSync("Offline · saving on this phone"));
window.addEventListener("online",()=>setSync("Back online · syncing…"));
if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("Offline cache unavailable",e)));
}
if(!configured) $("#signout").hidden=true;
render();
applyTheme(currentTheme());
applyLang(currentLang(),true);
resumeRest();
// Don't redraw under someone who is typing; redraw as soon as they leave the field instead.
const typing=()=>{ const a=document.activeElement; return !!(a&&a.matches&&a.matches("input:not([type=date]),select,textarea")); };
let renderPending=false;
function renderSoon(){ if(typing()){ renderPending=true; return; } renderPending=false; render(); }
// Wait a moment so a tap that moved focus (e.g. on "Add set") lands before the page is rebuilt.
document.addEventListener("focusout",()=>{ if(renderPending) setTimeout(()=>{ if(renderPending&&!typing()) renderSoon(); },400); });
// If the app stayed open past midnight, move "today" to the new day (dates picked on purpose stay).
let lastToday=today();
function checkNewDay(){
  const t=today(); if(t===lastToday) return;
  state.date=rolloverDate(state.date,lastToday,t); state.bdate=rolloverDate(state.bdate,lastToday,t); state.cdate=rolloverDate(state.cdate,lastToday,t);
  lastToday=t; stopEditing(); renderSoon();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkNewDay(); });
setInterval(checkNewDay,60000);
store.init(()=>{ renderSoon(); checkBadges(); });
})();
</script>
